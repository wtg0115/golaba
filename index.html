<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>골라봄</title>
<meta name="description" content="내가 고른 유튜브 영상만 보는 곳">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="골라봄">
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Roboto:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 유튜브식 상단바 + 반응형 썸네일 그리드 / 재생 화면은 왼쪽 플레이어 + 오른쪽 다음 영상 (좁으면 한 줄) */
:root{
  --bg:#ffffff; --fg:#0f0f0f; --fg2:#606060; --fg3:#909090;
  --hover:rgba(0,0,0,.05); --chip:rgba(0,0,0,.05); --chip-hover:rgba(0,0,0,.1);
  --chip-on:#0f0f0f; --chip-on-fg:#ffffff;
  --line:rgba(0,0,0,.1); --field:#ffffff; --field-line:#d3d3d3; --field-btn:#f8f8f8;
  --pop:#ffffff; --pop-shadow:0 4px 32px rgba(0,0,0,.12);
  --skeleton:rgba(0,0,0,.06);
  --snack:#0f0f0f; --snack-fg:#ffffff; --snack-link:#3ea6ff;
  --switch-on:#0f0f0f; --switch-knob:#ffffff;
  --focus:#065fd4; --danger:#cc0000; --warn-bg:#fff4e0;
  --brand:#ea2a3f; --accent:#ff0033;
  --font:"Roboto","Noto Sans KR","Noto Sans CJK KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-brand:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --hdr:56px; --gut:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f0f0f; --fg:#f1f1f1; --fg2:#aaaaaa; --fg3:#717171;
    --hover:rgba(255,255,255,.1); --chip:rgba(255,255,255,.1); --chip-hover:rgba(255,255,255,.2);
    --chip-on:#f1f1f1; --chip-on-fg:#0f0f0f;
    --line:rgba(255,255,255,.2); --field:#121212; --field-line:#303030; --field-btn:#222222;
    --pop:#282828; --pop-shadow:0 4px 32px rgba(0,0,0,.5);
    --skeleton:rgba(255,255,255,.08);
    --snack:#f1f1f1; --snack-fg:#0f0f0f; --snack-link:#065fd4;
    --switch-on:#f1f1f1; --switch-knob:#0f0f0f;
    --focus:#3ea6ff; --danger:#ff4e45; --warn-bg:#3a2c12;
    color-scheme:dark;
  }
}
@media (min-width:656px){ :root{ --gut:24px } }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
body.no-scroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
.ic{width:24px;height:24px;fill:currentColor;flex:none;display:block}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.grow{flex:1}

/* ---------- 상단바 ---------- */
.hdr{position:sticky;top:0;z-index:60;height:var(--hdr);display:flex;align-items:center;gap:16px;padding-inline:var(--gut);background:var(--bg)}
.hdr-start{display:flex;align-items:center;flex:none}
.logo{display:flex;align-items:center;gap:3px;height:40px;padding-right:6px}
.logo-mark{width:28px;height:28px;flex:none}
.lm-bg{fill:var(--brand)}
.logo-word{font-family:var(--font-brand);font-weight:900;font-size:19px;letter-spacing:-.07em;line-height:1}
.search{flex:0 1 728px;margin-inline:auto;display:flex;align-items:center;min-width:0}
.field{position:relative;flex:1;min-width:0;display:flex;align-items:center;height:40px;background:var(--field);border:1px solid var(--field-line);border-right:0;border-radius:40px 0 0 40px;padding-left:16px}
.field:focus-within{border-color:var(--focus);box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.s-ico{display:none;margin-right:12px}
.s-ico .ic{width:20px;height:20px}
.field:focus-within .s-ico{display:block}
.field input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--fg);font:400 16px var(--font);padding:0}
.field input::placeholder{color:var(--fg3)}
.s-clear{width:36px!important;height:36px!important;margin-right:2px}
.go{flex:none;width:64px;height:40px;border:1px solid var(--field-line);border-radius:0 40px 40px 0;background:var(--field-btn);display:grid;place-items:center;color:var(--fg)}
.go:hover{background:var(--chip)}
.s-back,.s-open{display:none!important}
.hdr-end{display:flex;align-items:center;gap:8px;flex:none}
.suggest{position:absolute;left:-1px;right:-65px;top:calc(100% + 4px);background:var(--pop);border-radius:12px;box-shadow:var(--pop-shadow);padding:12px 0;z-index:70}
.sug{display:flex;align-items:center;gap:14px;padding:7px 18px;font-size:16px;font-weight:500}
.sug:hover,.sug.on{background:var(--hover)}
.sug .ic{width:20px;height:20px;color:var(--fg2)}
.sug span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 버튼 ---------- */
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--fg);flex:none}
.icon-btn:hover{background:var(--hover)}
.icon-btn:active{background:var(--chip-hover)}
.btn-pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px 0 10px;border-radius:18px;border:0;background:var(--chip);font-weight:500;font-size:14px;color:var(--fg)}
.btn-pill:hover{background:var(--chip-hover)}
.add-ic{display:grid}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 16px;border-radius:18px;border:0;background:var(--fg);color:var(--bg);font-weight:500;font-size:14px;white-space:nowrap}
.btn-primary:hover{opacity:.85}
.btn-primary:disabled{background:var(--chip);color:var(--fg3);cursor:default;opacity:1}
.btn-text{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;border:0;background:transparent;font-weight:500;font-size:14px;color:var(--fg);white-space:nowrap}
.btn-text:hover{background:var(--hover)}
.btn-text .ic{width:20px;height:20px}
.btn-chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px 0 12px;border-radius:18px;border:0;background:var(--chip);font-weight:500;font-size:14px;white-space:nowrap;flex:none}
.btn-chip:hover{background:var(--chip-hover)}
.btn-chip .ic{width:20px;height:20px}

@media (max-width:655px){
  .hdr{gap:4px}
  .hdr-end{margin-left:auto;gap:0}
  .search{display:none}
  .s-open{display:grid!important}
  .add-pill{width:40px;padding:0;justify-content:center;border-radius:50%;background:transparent}
  .add-pill .add-txt{display:none}
  .hdr.searching .hdr-start,.hdr.searching .hdr-end{display:none}
  .hdr.searching .search{display:flex;flex:1;gap:4px}
  .hdr.searching .s-back{display:grid!important}
  .hdr.searching .field{border:0;border-radius:20px;background:var(--chip);padding-left:14px;box-shadow:none}
  .hdr.searching .s-ico{display:none}
  .hdr.searching .go{display:none}
  .suggest{position:fixed;left:0;right:0;top:var(--hdr);border-radius:0;box-shadow:0 8px 16px rgba(0,0,0,.08);padding:4px 0 8px}
}

/* ---------- 본문 ---------- */
#app{padding-inline:var(--gut);padding-bottom:56px}
body.is-watch #app{padding-inline:0}
.warn{margin:12px 0;padding:12px 16px;border-radius:12px;background:var(--warn-bg);font-size:14px;line-height:1.55;word-break:keep-all}

.chips{position:sticky;top:var(--hdr);z-index:40;background:var(--bg);display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:12px 0;margin-bottom:12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border:0;border-radius:8px;background:var(--chip);font-weight:500;font-size:14px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.chip:hover{background:var(--chip-hover)}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg)}
@media (max-width:655px){ .chips{margin-inline:calc(-1 * var(--gut));padding-inline:var(--gut);gap:8px;margin-bottom:4px} }

.grid{--cols:1;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:40px 16px;padding-top:8px}
@media (min-width:500px){ .grid{--cols:2} }
@media (min-width:900px){ .grid{--cols:3} }
@media (min-width:1300px){ .grid{--cols:4} }
@media (min-width:2000px){ .grid{--cols:5} }

.card{position:relative;min-width:0}
.thumb{position:relative;display:block;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--skeleton)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dur,.now{position:absolute;bottom:8px;padding:1px 4px;border-radius:4px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:500;line-height:18px;font-variant-numeric:tabular-nums}
.dur{right:8px}
.now{left:8px}
.prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.4)}
.prog i{display:block;height:100%;background:var(--accent)}
.prog ~ .dur{bottom:12px}
.meta{position:relative;display:flex;gap:12px;padding-top:12px;align-items:flex-start}
.avatar{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:hsl(var(--h) 36% 46%);color:#fff;font-size:15px;font-weight:500;line-height:1;font-family:var(--font-brand)}
.text{flex:1;min-width:0;padding-right:28px}
.text h3{margin:0 0 4px;font-size:16px;line-height:22px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.text h3.is-loading{color:var(--fg3)}
.sub{margin:0;font-size:14px;line-height:20px;color:var(--fg2)}
.sub .ch{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub .sep{display:none}
.more{position:absolute;top:4px;right:-12px;opacity:0}
.card:hover .more,.more:focus-visible,.more[aria-expanded="true"]{opacity:1}
@media (hover:none){ .more{opacity:1} }

@media (max-width:499px){
  .grid{margin-inline:calc(-1 * var(--gut));row-gap:24px}
  .grid .thumb{border-radius:0}
  .grid .meta{padding-inline:12px}
  .grid .more{right:0}
  .grid .sub .ch{display:inline}
  .grid .sub .sep{display:inline}
  .grid .text h3{font-size:15px;line-height:21px}
}

/* 목록형(재생 화면 옆, 검색 결과) */
@media (min-width:640px){
  .rows{display:flex;flex-direction:column;gap:8px}
  .rows .card{display:flex;gap:8px}
  .rows .thumb{width:168px;flex:none;border-radius:8px;align-self:flex-start}
  .rows .meta{padding-top:0;flex:1;min-width:0}
  .rows .avatar{display:none}
  .rows .text h3{font-size:14px;line-height:20px}
  .rows .sub{font-size:12px;line-height:18px}
  .rows .more{top:-8px;right:-10px}
  .rows.big{gap:16px}
  .rows.big .card{gap:16px}
  .rows.big .thumb{width:clamp(240px,40%,360px);border-radius:12px}
  .rows.big .text h3{font-size:18px;line-height:26px}
  .rows.big .sub{font-size:13px}
}
@media (max-width:639px){
  .rows{display:grid;gap:24px;margin-inline:calc(-1 * var(--gut))}
  .rows .thumb{border-radius:0}
  .rows .meta{padding-inline:12px}
  .rows .more{right:0}
  .rows .sub .ch{display:inline}
  .rows .sub .sep{display:inline}
  .rows .text h3{font-size:15px;line-height:21px}
}

/* ---------- 처음 화면 ---------- */
.empty{max-width:520px;margin:11vh auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty-mark .logo-mark{width:72px;height:72px}
.empty h1{margin:6px 0 0;font-size:24px;line-height:32px;font-weight:700;text-wrap:balance;word-break:keep-all}
.empty p{margin:0;color:var(--fg2);font-size:15px;line-height:1.6;word-break:keep-all}
.empty-add{display:flex;gap:8px;width:100%;margin-top:12px}
.empty-add input{flex:1;min-width:0;height:44px;border-radius:22px;border:1px solid var(--field-line);background:var(--field);color:var(--fg);padding:0 18px;font:16px var(--font)}
.empty-add input:focus{outline:0;border-color:var(--focus)}
.empty-add .btn-primary{height:44px;border-radius:22px;padding:0 22px;font-size:15px}
.empty .tip{font-size:13px}
.empty .err{font-size:13px;color:var(--danger)}
.row-btns{display:flex;gap:8px;margin-top:8px}
.results-head{padding:16px 0 12px;font-size:14px;color:var(--fg2)}
.noresult{text-align:center;padding:14vh 0 0}
.noresult p{margin:0 0 6px;font-size:16px;word-break:keep-all}
.noresult .sub{font-size:14px}

/* ---------- 재생 화면 ---------- */
.watch{display:grid;grid-template-columns:minmax(0,1fr) 402px;grid-template-areas:"p l" "i l";grid-template-rows:auto 1fr;column-gap:24px;max-width:1754px;margin:0 auto;padding:24px var(--gut) 0}
.w-player{grid-area:p;min-width:0}
.w-info{grid-area:i;padding-bottom:24px;min-width:0}
.w-list{grid-area:l;min-width:0}
.v-title{margin:12px 0 0;font-size:20px;line-height:28px;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
.v-title.is-loading{color:var(--fg3)}
.owner{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.owner .avatar{width:40px;height:40px;font-size:17px}
.owner-text{min-width:0;flex:1}
.owner-name{font-size:16px;font-weight:500;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.owner-sub{font-size:12px;line-height:18px;color:var(--fg2)}
.actions{display:flex;gap:8px;flex:none}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;font-size:16px;font-weight:700}
.switch-row{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--fg2);cursor:pointer}
.switch{position:relative;width:36px;height:20px;border-radius:10px;border:0;background:var(--chip-hover);padding:0;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--switch-on)}
.switch[aria-checked="true"]::after{transform:translateX(16px);background:var(--switch-knob)}
.list-empty{padding:16px 0;color:var(--fg2);font-size:14px;line-height:1.6;word-break:keep-all;display:flex;flex-direction:column;align-items:flex-start;gap:12px}

@media (max-width:1015px){
  .watch{display:block;padding:0}
  .w-player{position:sticky;top:0;z-index:45}
  .w-info{padding:12px var(--gut) 20px}
  .w-list{padding:0 var(--gut)}
  body.is-watch .hdr{position:relative}
  .v-title{font-size:18px;line-height:26px;margin-top:0}
  .actions{width:100%;overflow-x:auto;scrollbar-width:none}
  .actions::-webkit-scrollbar{display:none}
  .list-head{padding-top:16px;border-top:1px solid var(--line)}
}
body.pfs .w-player{z-index:300}

/* ---------- 플레이어 ---------- */
.player{position:relative;width:100%;aspect-ratio:16/9;max-height:calc(100vh - var(--hdr) - 136px);min-height:180px;background:#000;border-radius:12px;overflow:hidden;color:#fff;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;isolation:isolate;outline:0}
@media (max-width:1015px){ .player{border-radius:0;max-height:72vh} }
.yt-host{position:absolute;inset:0}
.yt-host iframe,.yt-host>div{position:absolute;inset:0;width:100%!important;height:100%!important;border:0}
.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;transition:opacity .25s}
.player.started .poster,.player.tap-mode .poster,.player.passthru .poster{opacity:0;visibility:hidden}
.shield{position:absolute;inset:0;z-index:2;touch-action:manipulation}
.band{position:absolute;z-index:2;display:none}
.band-top{left:0;right:0;top:0;height:22%}
.band-bl{left:0;bottom:0;width:58%;height:24%}
.player.tap-mode .shield,.player.passthru .shield{display:none}
.player.tap-mode .band,.player.passthru .band{display:block}

.ui{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .2s}
.ui::after{content:"";position:absolute;left:0;right:0;bottom:0;height:min(130px,55%);background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,.28) 55%,transparent);pointer-events:none;z-index:-1}
.player.show-ui .ui{opacity:1}
.player.show-ui .ui-bottom,.player.show-ui .ui-center .cbtn{pointer-events:auto}
.player:not(.started) .ui,.player.tap-mode .ui,.player.passthru .ui,.player.ended .ui,.player.error .ui{display:none}
.player.hide-cursor{cursor:none}
.ui-bottom{position:absolute;left:0;right:0;bottom:0;padding:0 12px}
.bar{position:relative;height:16px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.track{position:relative;flex:1;height:3px;background:rgba(255,255,255,.25);transition:height .1s}
.bar:hover .track,.player.dragging .track{height:5px}
.buf,.fill{position:absolute;left:0;top:0;bottom:0;width:0}
.buf{background:rgba(255,255,255,.45)}
.fill{background:var(--accent)}
.knob{position:absolute;top:50%;left:0;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .1s}
.bar:hover .knob,.player.dragging .knob{transform:scale(1)}
.tip{position:absolute;bottom:22px;left:0;transform:translateX(-50%);padding:3px 8px;border-radius:4px;background:rgba(28,28,28,.9);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;opacity:0;pointer-events:none;white-space:nowrap}
.bar:hover .tip,.player.dragging .tip{opacity:1}
.ctrl{display:flex;align-items:center;height:48px}
.pbtn{width:44px;height:44px;border:0;background:transparent;color:#fff;display:grid;place-items:center;flex:none;opacity:.92;border-radius:50%;padding:0}
.pbtn:hover{opacity:1}
.pbtn .ic{width:26px;height:26px}
.time{font-size:13px;padding:0 8px;white-space:nowrap;font-variant-numeric:tabular-nums;color:#eee}
.time .sep{opacity:.7;padding:0 3px}
.vol{display:flex;align-items:center}
.vol input{width:0;opacity:0;transition:width .15s,opacity .15s,margin .15s;accent-color:#fff;margin:0}
.vol:hover input,.vol:focus-within input{width:64px;opacity:1;margin-right:8px}
.player.playing .i-play,.player:not(.playing) .i-pause{display:none}
.player.muted .i-vol,.player:not(.muted) .i-mute{display:none}
.player.fs .i-fs,.player:not(.fs) .i-fsx{display:none}
.ui-center{display:none}

.spinner{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .9s linear infinite;z-index:5;display:none;pointer-events:none}
.player.buffering .spinner,.player:not(.started):not(.tap-mode):not(.error) .spinner{display:block}
.player.ended .spinner,.player.passthru .spinner{display:none!important}
@keyframes spin{to{transform:rotate(360deg)}}
.bezel{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:5;opacity:0;pointer-events:none}
.bezel .ic{width:34px;height:34px}
.bezel.go{animation:bezel .5s linear}
@keyframes bezel{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(2)}}
.flash{position:absolute;top:0;bottom:0;width:42%;z-index:5;display:grid;place-items:center;pointer-events:none;opacity:0;background:rgba(255,255,255,.14)}

/* 링크에서 유튜브 영상 ID 뽑기 (watch, youtu.be, shorts, live, embed 모두 가능) */
function parseIds(text) {

const find = id => db.videos.find(v => v.id === id);
const idxOf = id => db.videos.findIndex(v => v.id === id);
function nextOf(id) { const n = db.videos.length, i = idxOf(id); return n > 1 && i >= 0 ? db.videos[(i + 1) % n] : null; }
function prevOf(id) { const n = db.videos.length, i = idxOf(id); return n > 1 && i >= 0 ? db.videos[(i - 1 + n) % n] : null; }
function upcoming(id) {
  const i = idxOf(id), n = db.videos.length, out = [];
  for (let k = 1; k < n; k++) out.push(db.videos[(i + k) % n]);
  return out;
}

/* ---------- 제목·채널 가져오기 ---------- */
async function getJSON(url, ms = 7000) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, { signal: c.signal }); if (!r.ok) throw r.status; return await r.json(); }
  finally { clearTimeout(t); }
}
async function fetchMeta(id) {
  const w = encodeURIComponent('https://www.youtube.com/watch?v=' + id);
  for (const u of [`https://www.youtube.com/oembed?format=json&url=${w}`, `https://noembed.com/embed?url=${w}`]) {
    try { const j = await getJSON(u); if (j && j.title && !j.error) return { title: j.title, author: j.author_name || '' }; } catch (e) {}
  }
  return null;
}
const metaQ = []; let metaBusy = false;
function queueMeta(id) { if (!metaQ.includes(id)) metaQ.push(id); runMeta(); }
async function runMeta() {
  if (metaBusy) return; metaBusy = true;
  while (metaQ.length) {
    const id = metaQ.shift(), v = find(id);
    if (!v) continue;
    if (!v.title) { const m = await fetchMeta(id); if (m && find(id)) { v.title = m.title; v.author = v.author || m.author; save(); rerender(); } }
    if ((!v.title || !v.dur) && !v.probed && !probe.q.includes(id)) probe.q.push(id);
  }
  metaBusy = false; runProbe();
}

/* 숨은 플레이어로 제목·길이 확인 (위 방법이 막혔을 때 대비) */
const probe = { q: [], busy: false, yt: null, cb: null };
async function runProbe() {
  if (probe.busy || !probe.q.length || view.name === 'watch') return;
  probe.busy = true;
  try { await loadApi(); } catch (e) { probe.busy = false; return; }
  while (probe.q.length && view.name !== 'watch') {
    const id = probe.q.shift(), v = find(id);
    if (!v || (v.title && v.dur)) continue;
    const info = await probeOne(id);
    const cur = find(id); if (!cur) continue;
    cur.probed = true;
    if (info) {
      if (!cur.title && info.title) { cur.title = info.title; cur.author = cur.author || info.author; }
      if (!cur.dur && info.dur) cur.dur = info.dur;
      if (info.blocked) cur.blocked = true;
    }
    save(); rerender();
  }
  probe.busy = false;
}
function probeOne(id) {
  return new Promise(res => {
    let iv = 0, n = 0;
    const done = x => { clearTimeout(to); clearInterval(iv); probe.cb = null; res(x); };
    const to = setTimeout(() => done(null), 9000);
    const poll = () => {
      clearInterval(iv);
      iv = setInterval(() => {
        n++;
        try {
          const d = probe.yt.getVideoData() || {}, dur = Math.round(probe.yt.getDuration() || 0);
          if (d.video_id === id && d.title && (dur > 0 || n > 14)) done({ title: d.title, author: d.author || '', dur });
        } catch (e) {}
      }, 250);
    };
    probe.cb = { ready: poll, error: code => done({ blocked: code === 101 || code === 150 }) };
    if (probe.yt) { try { probe.yt.cueVideoById(id); poll(); } catch (e) { done(null); } return; }
    const host = document.createElement('div');
    host.setAttribute('aria-hidden', 'true');
    host.style.cssText = 'position:fixed;left:-10000px;top:0;width:320px;height:180px;opacity:0;pointer-events:none';
    const inner = document.createElement('div'); host.appendChild(inner); document.body.appendChild(host);
    probe.yt = new YT.Player(inner, {
      videoId: id, width: 320, height: 180,
      playerVars: { autoplay: 0, controls: 0, playsinline: 1, ...originVar() },
      events: { onReady: () => probe.cb && probe.cb.ready(), onError: e => probe.cb && probe.cb.error(e.data) }
    });
  });
}

/* ---------- 유튜브 플레이어 API ---------- */
let apiP = null;
function loadApi() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  if (apiP) return apiP;
  apiP = new Promise((res, rej) => {
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (prev) prev(); res(); };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api'; s.async = true;
    s.onerror = () => { apiP = null; rej(new Error('api')); };
    document.head.appendChild(s);
    setTimeout(() => { if (!(window.YT && window.YT.Player)) { apiP = null; rej(new Error('timeout')); } }, 15000);
  });
  return apiP;
}
const originVar = () => /^https?:$/.test(location.protocol) ? { origin: location.origin } : {};

/* ---------- 플레이어 동작 ---------- */
const P = { alive: false, yt: null, ready: false, v: null, el: null, state: -1, started: false, dur: 0,
  tick: 0, uiT: 0, tapT: 0, endT: 0, lastSave: 0, lastT: -1, stall: 0, drag: false, frac: 0 };
const pc = () => P.el.classList;

function startAt(v) { return !v.watched && v.pos > 5 && (!v.dur || v.pos < v.dur - 10) ? v.pos : 0; }

function pMount(v) {
  Object.assign(P, { alive: true, yt: null, ready: false, v, el: $('#player'), state: -1, started: false, dur: v.dur || 0, lastT: -1, stall: 0 });
  bindPlayer();
  paintBar(startAt(v), v.dur || 0, 0);
  loadApi().then(() => {
    if (!P.alive) return;
    P.yt = new YT.Player('ytHost', {
      videoId: P.v.id, width: '100%', height: '100%',
      playerVars: { autoplay: 1, controls: 0, disablekb: 1, fs: 0, rel: 0, iv_load_policy: 3, modestbranding: 1, playsinline: 1, cc_load_policy: 0, hl: 'ko', start: Math.floor(startAt(P.v)), ...originVar() },
      events: { onReady: pReady, onStateChange: pState, onError: pError, onPlaybackRateChange: () => {} }
    });
    armTap();
  }).catch(() => showErr('api'));
}
function pReady() {
  if (!P.alive) return;
  P.ready = true;
  const pr = db.prefs;
  try { P.yt.setVolume(pr.volume); pr.muted ? P.yt.mute() : P.yt.unMute(); P.yt.setPlaybackRate(pr.rate); P.yt.playVideo(); } catch (e) {}
  syncVol();
  clearInterval(P.tick); P.tick = setInterval(onTick, 250);
}
function pLoad(v) {
  saveProgress();
  P.v = v; P.started = false; P.dur = v.dur || 0; P.lastT = -1; P.stall = 0;
  hideEnd(); hideErr(); closeGear();
  pc().remove('started', 'playing', 'paused', 'passthru', 'show-ui');
  $('#poster').src = thumb(v.id);
  paintBar(startAt(v), v.dur || 0, 0);
  if (P.ready) { try { P.yt.loadVideoById({ videoId: v.id, startSeconds: Math.floor(startAt(v)) }); } catch (e) {} armTap(); }
}
function pTeardown() {
  if (!P.alive) return;
  saveProgress();
  exitFS();
  clearInterval(P.tick); clearTimeout(P.uiT); clearTimeout(P.tapT); clearInterval(P.endT);
  try { P.yt && P.yt.destroy(); } catch (e) {}
  Object.assign(P, { alive: false, yt: null, ready: false, el: null });
  document.title = '골라봄';
}
/* 브라우저가 자동재생을 막으면, 유튜브 화면을 직접 한 번 눌러서 재생하도록 열어 줌 */
function armTap() {
  clearTimeout(P.tapT); pc().remove('tap-mode');
  P.tapT = setTimeout(() => { if (P.alive && !P.started && !pc().contains('error')) pc().add('tap-mode'); }, 2200);
}
function pState(e) {
  if (!P.alive) return;
  P.state = e.data;
  const c = pc();
  c.toggle('buffering', P.state === 3);
  if (P.state === 1) {
    P.started = true; clearTimeout(P.tapT);
    c.add('started', 'playing'); c.remove('paused', 'tap-mode', 'ended');
    hideEnd(); backfill();
    try { if (P.yt.getPlaybackRate() !== db.prefs.rate) P.yt.setPlaybackRate(db.prefs.rate); } catch (er) {}
    if (c.contains('show-ui')) autoHide();
  } else if (P.state === 2) {
    c.remove('playing'); c.add('paused'); showUI(); saveProgress();
  } else if (P.state === 0) {
    c.remove('playing', 'paused', 'buffering'); onEnded();
  }
}
function pError(e) {
  const code = e && e.data;
  if (code === 101 || code === 150) { P.v.blocked = true; save(); }
  showErr(code);
}
const ERRS = {
  2: '링크가 잘못된 영상이에요.',
  5: '이 브라우저에서는 재생할 수 없는 영상이에요.',
  100: '삭제됐거나 비공개로 바뀐 영상이에요.',
  101: '업로더가 다른 사이트에서는 못 보게 막아 둔 영상이에요.',
  150: '업로더가 다른 사이트에서는 못 보게 막아 둔 영상이에요.',
  153: '유튜브가 이 주소에서의 재생을 막았어요. 파일을 바로 열었다면 웹에 올린 주소(https://…)로 열어 주세요.',
  api: '플레이어를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.'
};
function showErr(code) {

  bar.addEventListener('pointerup', endDrag);

/* 키보드 단축키 (유튜브와 같음) */

    case 'ArrowUp': setVol((db.prefs.muted ? 0 : db.prefs.volume) + 5); break;

  save();
  fresh.forEach(queueMeta);
  if (view.name === 'home' || view.name === 'missing') { view.filter = 'all'; if (view.name === 'missing') location.hash = '#/watch/' + fresh[0]; else renderHome(); }
  else rerender();

  return fresh.length;
}

}

}
function closeMenu() {
  if (!menuOpen) return;
  menuOpen.m.remove(); menuOpen.scrim.remove(); menuOpen.anchor.setAttribute('aria-expanded', 'false');
  menuOpen = null;
}
addEventListener('resize', closeMenu);
function cardMenu(id) {
  const v = find(id); if (!v) return [];
  const items = [
    { icon: 'del', label: '목록에서 빼기', run: () => removeVideo(id) },
    { icon: 'link', label: '링크 복사', run: () => copyLink(id) }
  ];
  if (idxOf(id) > 0) items.push({ icon: 'top', label: '맨 앞으로 옮기기', run: () => { const i = idxOf(id); db.videos.unshift(...db.videos.splice(i, 1)); save(); rerender(); } });
  if (v.pos || v.watched) items.push({ icon: 'history', label: '시청 기록 지우기', run: () => { v.pos = 0; v.watched = false; save(); rerender(); } });
  return items;
}
function hdrMenu() {
  return [
    { icon: 'add', label: '영상 추가', run: () => openAdd() },
    { icon: 'copy', label: '모든 링크 복사 (백업·옮기기)', run: async () => {
      if (!db.videos.length) return toast('아직 넣어 둔 영상이 없어요');
      const ok = await copyText(db.videos.map(v => 'https://youtu.be/' + v.id).join('\n'));
      toast(ok ? `링크 ${db.videos.length}개를 복사했어요. 다른 기기의 추가 창에 붙여넣으면 그대로 옮겨져요` : '복사하지 못했어요');
    } },
    { icon: 'history', label: '시청 기록 모두 지우기', run: () => { db.videos.forEach(v => { v.pos = 0; v.watched = false; }); save(); rerender(); toast('시청 기록을 지웠어요'); } }
  ];
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (er) {} ta.remove(); return ok;
  }
}
async function copyLink(id) { toast(await copyText('https://youtu.be/' + id) ? '링크를 복사했어요' : '복사하지 못했어요'); }

/* ---------- 알림 ---------- */
let toastT = 0;
function toast(msg, action) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button class="toast-btn" type="button">${esc(action.label)}</button>` : ''}`;
  if (action) $('.toast-btn', t).onclick = () => { t.classList.remove('on'); action.run(); };
  t.classList.remove('on'); void t.offsetWidth; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), action ? 6000 : 3200);
}

/* ---------- 상단바 검색 ---------- */
const q = $('#q'), sug = $('#suggest');
$('#sBack').innerHTML = icon('back'); $('#sIco').innerHTML = icon('search'); $('#sClear').innerHTML = icon('close');
$('#sGo').innerHTML = icon('search'); $('#sOpen').innerHTML = icon('search');
$('.add-ic').innerHTML = icon('add'); $('#hdrMore').innerHTML = icon('more');
function syncClear() { $('#sClear').hidden = !q.value; }
let sugSel = -1;
function updateSuggest() {
  const s = q.value.trim(); sugSel = -1;
  if (!s) return hideSuggest();
  const res = searchVideos(s).filter(v => v.title).slice(0, 8);
  if (!res.length) return hideSuggest();
  sug.innerHTML = res.map(v => `<a class="sug" role="option" href="#/watch/${v.id}">${icon('search')}<span>${esc(v.title)}</span></a>`).join('');
  sug.hidden = false;
}
function hideSuggest() { sug.hidden = true; sugSel = -1; }
q.addEventListener('input', () => { syncClear(); updateSuggest(); });
q.addEventListener('focus', updateSuggest);
q.addEventListener('blur', () => setTimeout(hideSuggest, 180));
q.addEventListener('keydown', e => {
  const items = [...sug.querySelectorAll('.sug')];
  if (sug.hidden || !items.length || (e.key !== 'ArrowDown' && e.key !== 'ArrowUp')) return;
  e.preventDefault();
  const n = items.length;
  if (e.key === 'ArrowDown') sugSel = sugSel + 1 >= n ? -1 : sugSel + 1;
  else sugSel = sugSel - 1 < -1 ? n - 1 : sugSel - 1;
  items.forEach((a, i) => a.classList.toggle('on', i === sugSel));
});
$('#searchForm').addEventListener('submit', e => {
  e.preventDefault();
  const items = [...sug.querySelectorAll('.sug')];
  if (!sug.hidden && sugSel >= 0 && items[sugSel]) { location.hash = items[sugSel].getAttribute('href'); q.blur(); return; }
  const s = q.value.trim(); if (!s) return;
  q.blur(); hideSuggest();
  const h = '#/search/' + encodeURIComponent(s);
  if (location.hash === h) showSearch(s); else location.hash = h;
});
$('#sOpen').addEventListener('click', () => { hdr.classList.add('searching'); q.focus(); updateSuggest(); });
$('#sBack').addEventListener('click', () => { hdr.classList.remove('searching'); hideSuggest(); });
$('#sClear').addEventListener('click', () => { q.value = ''; syncClear(); q.focus(); hideSuggest(); });
sug.addEventListener('click', () => { hideSuggest(); q.blur(); hdr.classList.remove('searching'); });

/* ---------- 버튼 연결 ---------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const id = a.dataset.id;
  switch (a.dataset.act) {
    case 'add': openAdd(); break;
    case 'card-menu': e.preventDefault(); if (menuOpen && menuOpen.anchor === a) closeMenu(); else openMenu(a, cardMenu(id)); break;
    case 'hdr-more': if (menuOpen && menuOpen.anchor === a) closeMenu(); else openMenu(a, hdrMenu()); break;
    case 'chip': view.filter = a.dataset.f; renderHome(); break;
    case 'copy-link': copyLink(id); break;
    case 'remove': removeVideo(id); break;
    case 'add-this': addIds([id]); break;
    case 'autoplay': e.preventDefault(); db.prefs.autoplay = !db.prefs.autoplay; save(); a.setAttribute('aria-checked', String(db.prefs.autoplay)); toast(db.prefs.autoplay ? '자동재생을 켰어요' : '자동재생을 껐어요'); break;
  }
});

/* ---------- 주소(#)에 따라 화면 바꾸기 ---------- */
function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const i = h.indexOf('/'), a = i < 0 ? h : h.slice(0, i), arg = i < 0 ? '' : h.slice(i + 1);
  let dec = arg; try { dec = decodeURIComponent(arg); } catch (e) {}
  if (a === 'watch' && dec) showWatch(dec);
  else if (a === 'search' && dec) showSearch(dec);
  else showHome();
}
addEventListener('hashchange', route);
route();
db.videos.forEach(v => { if (!v.title || !v.dur) queueMeta(v.id); });
})();
</script>
