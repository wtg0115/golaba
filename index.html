<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>골라봄</title>
<meta name="description" content="내가 고른 유튜브 영상만 보는 곳">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="골라봄">
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Roboto:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 유튜브식 상단바 + 반응형 썸네일 그리드 / 재생 화면은 왼쪽 플레이어 + 오른쪽 다음 영상 (좁으면 한 줄) */
:root{
  --bg:#ffffff; --fg:#0f0f0f; --fg2:#606060; --fg3:#909090;
  --hover:rgba(0,0,0,.05); --chip:rgba(0,0,0,.05); --chip-hover:rgba(0,0,0,.1);
  --chip-on:#0f0f0f; --chip-on-fg:#ffffff;
  --line:rgba(0,0,0,.1); --field:#ffffff; --field-line:#d3d3d3; --field-btn:#f8f8f8;
  --pop:#ffffff; --pop-shadow:0 4px 32px rgba(0,0,0,.12);
  --skeleton:rgba(0,0,0,.06);
  --snack:#0f0f0f; --snack-fg:#ffffff; --snack-link:#3ea6ff;
  --switch-on:#0f0f0f; --switch-knob:#ffffff;
  --focus:#065fd4; --danger:#cc0000; --warn-bg:#fff4e0;
  --brand:#ea2a3f; --accent:#ff0033;
  --font:"Roboto","Noto Sans KR","Noto Sans CJK KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-brand:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --hdr:56px; --gut:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f0f0f; --fg:#f1f1f1; --fg2:#aaaaaa; --fg3:#717171;
    --hover:rgba(255,255,255,.1); --chip:rgba(255,255,255,.1); --chip-hover:rgba(255,255,255,.2);
    --chip-on:#f1f1f1; --chip-on-fg:#0f0f0f;
    --line:rgba(255,255,255,.2); --field:#121212; --field-line:#303030; --field-btn:#222222;
    --pop:#282828; --pop-shadow:0 4px 32px rgba(0,0,0,.5);
    --skeleton:rgba(255,255,255,.08);
    --snack:#f1f1f1; --snack-fg:#0f0f0f; --snack-link:#065fd4;
    --switch-on:#f1f1f1; --switch-knob:#0f0f0f;
    --focus:#3ea6ff; --danger:#ff4e45; --warn-bg:#3a2c12;
    --amb:block;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0f0f0f; --fg:#f1f1f1; --fg2:#aaaaaa; --fg3:#717171;
    --hover:rgba(255,255,255,.1); --chip:rgba(255,255,255,.1); --chip-hover:rgba(255,255,255,.2);
    --chip-on:#f1f1f1; --chip-on-fg:#0f0f0f;
    --line:rgba(255,255,255,.2); --field:#121212; --field-line:#303030; --field-btn:#222222;
    --pop:#282828; --pop-shadow:0 4px 32px rgba(0,0,0,.5);
    --skeleton:rgba(255,255,255,.08);
    --snack:#f1f1f1; --snack-fg:#0f0f0f; --snack-link:#065fd4;
    --switch-on:#f1f1f1; --switch-knob:#0f0f0f;
    --focus:#3ea6ff; --danger:#ff4e45; --warn-bg:#3a2c12;
    --amb:block;
    color-scheme:dark;
}
@media (min-width:656px){ :root{ --gut:24px } }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
body.no-scroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
.ic{width:24px;height:24px;fill:currentColor;flex:none;display:block}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.grow{flex:1}

/* ---------- 상단바 ---------- */
.hdr{position:sticky;top:0;z-index:60;height:var(--hdr);display:flex;align-items:center;gap:16px;padding-inline:var(--gut);background:var(--bg)}
.hdr-start{display:flex;align-items:center;flex:none}
.logo{display:flex;align-items:center;gap:3px;height:40px;padding-right:6px}
.logo-mark{width:28px;height:28px;flex:none}
.lm-bg{fill:var(--brand)}
.logo-word{font-family:var(--font-brand);font-weight:900;font-size:19px;letter-spacing:-.07em;line-height:1}
.search{flex:0 1 728px;margin-inline:auto;display:flex;align-items:center;min-width:0}
.field{position:relative;flex:1;min-width:0;display:flex;align-items:center;height:40px;background:var(--field);border:1px solid var(--field-line);border-right:0;border-radius:40px 0 0 40px;padding-left:16px}
.field:focus-within{border-color:var(--focus);box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.s-ico{display:none;margin-right:12px}
.s-ico .ic{width:20px;height:20px}
.field:focus-within .s-ico{display:block}
.field input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--fg);font:400 16px var(--font);padding:0}
.field input::placeholder{color:var(--fg3)}
.s-clear{width:36px!important;height:36px!important;margin-right:2px}
.go{flex:none;width:64px;height:40px;border:1px solid var(--field-line);border-radius:0 40px 40px 0;background:var(--field-btn);display:grid;place-items:center;color:var(--fg)}
.go:hover{background:var(--chip)}
.s-back,.s-open{display:none!important}
.hdr-end{display:flex;align-items:center;gap:8px;flex:none}
.suggest{position:absolute;left:-1px;right:-65px;top:calc(100% + 4px);background:var(--pop);border-radius:12px;box-shadow:var(--pop-shadow);padding:12px 0;z-index:70}
.sug{display:flex;align-items:center;gap:14px;padding:7px 18px;font-size:16px;font-weight:500}
.sug:hover,.sug.on{background:var(--hover)}
.sug .ic{width:20px;height:20px;color:var(--fg2)}
.sug span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 버튼 ---------- */
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--fg);flex:none}
.icon-btn:hover{background:var(--hover)}
.icon-btn:active{background:var(--chip-hover)}
.btn-pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px 0 10px;border-radius:18px;border:0;background:var(--chip);font-weight:500;font-size:14px;color:var(--fg)}
.btn-pill:hover{background:var(--chip-hover)}
.add-ic{display:grid}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 16px;border-radius:18px;border:0;background:var(--fg);color:var(--bg);font-weight:500;font-size:14px;white-space:nowrap}
.btn-primary:hover{opacity:.85}
.btn-primary:disabled{background:var(--chip);color:var(--fg3);cursor:default;opacity:1}
.btn-text{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;border:0;background:transparent;font-weight:500;font-size:14px;color:var(--fg);white-space:nowrap}
.btn-text:hover{background:var(--hover)}
.btn-text .ic{width:20px;height:20px}
.btn-chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px 0 12px;border-radius:18px;border:0;background:var(--chip);font-weight:500;font-size:14px;white-space:nowrap;flex:none}
.btn-chip:hover{background:var(--chip-hover)}
.btn-chip .ic{width:20px;height:20px}

@media (max-width:655px){
  .hdr{gap:4px}
  .hdr-end{margin-left:auto;gap:0}
  .search{display:none}
  .s-open{display:grid!important}
  .add-pill{width:40px;padding:0;justify-content:center;border-radius:50%;background:transparent}
  .add-pill .add-txt{display:none}
  .hdr.searching .hdr-start,.hdr.searching .hdr-end{display:none}
  .hdr.searching .search{display:flex;flex:1;gap:4px}
  .hdr.searching .s-back{display:grid!important}
  .hdr.searching .field{border:0;border-radius:20px;background:var(--chip);padding-left:14px;box-shadow:none}
  .hdr.searching .s-ico{display:none}
  .hdr.searching .go{display:none}
  .suggest{position:fixed;left:0;right:0;top:var(--hdr);border-radius:0;box-shadow:0 8px 16px rgba(0,0,0,.08);padding:4px 0 8px}
}

/* ---------- 본문 ---------- */
#app{padding-inline:var(--gut);padding-bottom:56px}
body.is-watch #app{padding-inline:0}
.install{display:flex;align-items:center;gap:12px;margin:8px 0 4px;padding:12px 6px 12px 12px;border-radius:12px;background:var(--chip)}
.install-ic{width:40px;height:40px;border-radius:10px;flex:none}
.install-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.45;color:var(--fg2);word-break:keep-all}
.install-txt b{font-size:14px;font-weight:500;color:var(--fg)}
.install .btn-primary{flex:none;padding:0 14px}
.install-x{width:36px!important;height:36px!important}
.install-x .ic{width:20px;height:20px}
.steps{margin:4px 0 0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;align-items:center;gap:12px;font-size:15px;line-height:1.5;word-break:keep-all}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-weight:700;font-size:14px}
.dlg-note{margin:4px 0 0;padding:10px 12px;border-radius:10px;background:var(--chip);font-size:13px;line-height:1.5;color:var(--fg2);word-break:keep-all}
.warn{margin:12px 0;padding:12px 16px;border-radius:12px;background:var(--warn-bg);font-size:14px;line-height:1.55;word-break:keep-all}

.chips{position:sticky;top:var(--hdr);z-index:40;background:var(--bg);display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:12px 0;margin-bottom:12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border:0;border-radius:8px;background:var(--chip);font-weight:500;font-size:14px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.chip:hover{background:var(--chip-hover)}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg)}
@media (max-width:655px){ .chips{margin-inline:calc(-1 * var(--gut));padding-inline:var(--gut);gap:8px;margin-bottom:4px} }

.grid{--cols:1;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:40px 16px;padding-top:8px}
@media (min-width:500px){ .grid{--cols:2} }
@media (min-width:900px){ .grid{--cols:3} }
@media (min-width:1300px){ .grid{--cols:4} }
@media (min-width:2000px){ .grid{--cols:5} }

.card{position:relative;min-width:0}
.thumb{position:relative;display:block;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--skeleton)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dur,.now{position:absolute;bottom:8px;padding:1px 4px;border-radius:4px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:500;line-height:18px;font-variant-numeric:tabular-nums}
.dur{right:8px}
.now{left:8px}
.prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.4)}
.prog i{display:block;height:100%;background:var(--accent)}
.prog ~ .dur{bottom:12px}
.meta{position:relative;display:flex;gap:12px;padding-top:12px;align-items:flex-start}
.avatar{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:hsl(var(--h) 36% 46%);color:#fff;font-size:15px;font-weight:500;line-height:1;font-family:var(--font-brand)}
.text{flex:1;min-width:0;padding-right:28px}
.text h3{margin:0 0 4px;font-size:16px;line-height:22px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.text h3.is-loading{color:var(--fg3)}
.sub{margin:0;font-size:14px;line-height:20px;color:var(--fg2)}
.sub .ch{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub .sep{display:none}
.more{position:absolute;top:4px;right:-12px;opacity:0}
.card:hover .more,.more:focus-visible,.more[aria-expanded="true"]{opacity:1}
@media (hover:none){ .more{opacity:1} }

@media (max-width:499px){
  .grid{margin-inline:calc(-1 * var(--gut));row-gap:24px}
  .grid .thumb{border-radius:0}
  .grid .meta{padding-inline:12px}
  .grid .more{right:0}
  .grid .sub .ch{display:inline}
  .grid .sub .sep{display:inline}
  .grid .text h3{font-size:15px;line-height:21px}
}

/* 목록형(재생 화면 옆, 검색 결과) */
@media (min-width:640px){
  .rows{display:flex;flex-direction:column;gap:8px}
  .rows .card{display:flex;gap:8px}
  .rows .thumb{width:168px;flex:none;border-radius:8px;align-self:flex-start}
  .rows .meta{padding-top:0;flex:1;min-width:0}
  .rows .avatar{display:none}
  .rows .text h3{font-size:14px;line-height:20px}
  .rows .sub{font-size:12px;line-height:18px}
  .rows .more{top:-8px;right:-10px}
  .rows.big{gap:16px}
  .rows.big .card{gap:16px}
  .rows.big .thumb{width:clamp(240px,40%,360px);border-radius:12px}
  .rows.big .text h3{font-size:18px;line-height:26px}
  .rows.big .sub{font-size:13px}
}
@media (max-width:639px){
  .rows{display:grid;gap:24px;margin-inline:calc(-1 * var(--gut))}
  .rows .thumb{border-radius:0}
  .rows .meta{padding-inline:12px}
  .rows .more{right:0}
  .rows .sub .ch{display:inline}
  .rows .sub .sep{display:inline}
  .rows .text h3{font-size:15px;line-height:21px}
}

/* ---------- 처음 화면 ---------- */
.empty{max-width:520px;margin:11vh auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty-mark .logo-mark{width:72px;height:72px}
.empty h1{margin:6px 0 0;font-size:24px;line-height:32px;font-weight:700;text-wrap:balance;word-break:keep-all}
.empty p{margin:0;color:var(--fg2);font-size:15px;line-height:1.6;word-break:keep-all}
.empty-add{display:flex;gap:8px;width:100%;margin-top:12px}
.empty-add input{flex:1;min-width:0;height:44px;border-radius:22px;border:1px solid var(--field-line);background:var(--field);color:var(--fg);padding:0 18px;font:16px var(--font)}
.empty-add input:focus{outline:0;border-color:var(--focus)}
.empty-add .btn-primary{height:44px;border-radius:22px;padding:0 22px;font-size:15px}
.empty .tip{font-size:13px}
.empty .err{font-size:13px;color:var(--danger)}
.row-btns{display:flex;gap:8px;margin-top:8px}
.results-head{padding:16px 0 12px;font-size:14px;color:var(--fg2)}
.noresult{text-align:center;padding:14vh 0 0}
.noresult p{margin:0 0 6px;font-size:16px;word-break:keep-all}
.noresult .sub{font-size:14px}

/* ---------- 재생 화면 ---------- */
.watch{display:grid;grid-template-columns:minmax(0,1fr) 402px;grid-template-areas:"p l" "i l";grid-template-rows:auto 1fr;column-gap:24px;max-width:1754px;margin:0 auto;padding:24px var(--gut) 0}
.w-player{grid-area:p;min-width:0}
.w-info{grid-area:i;padding-bottom:24px;min-width:0}
.w-list{grid-area:l;min-width:0}
.v-title{margin:12px 0 0;font-size:20px;line-height:28px;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
.v-title.is-loading{color:var(--fg3)}
.owner{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.owner .avatar{width:40px;height:40px;font-size:17px}
.owner-text{min-width:0;flex:1}
.owner-name{font-size:16px;font-weight:500;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.owner-sub{font-size:12px;line-height:18px;color:var(--fg2)}
.actions{display:flex;gap:8px;flex:none}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;font-size:16px;font-weight:700}
.switch-row{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--fg2);cursor:pointer}
.switch{position:relative;width:36px;height:20px;border-radius:10px;border:0;background:var(--chip-hover);padding:0;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--switch-on)}
.switch[aria-checked="true"]::after{transform:translateX(16px);background:var(--switch-knob)}
.list-empty{padding:16px 0;color:var(--fg2);font-size:14px;line-height:1.6;word-break:keep-all;display:flex;flex-direction:column;align-items:flex-start;gap:12px}

@media (max-width:1015px){
  .watch{display:block;padding:0}
  .w-player{position:sticky;top:0;z-index:45}
  .w-info{padding:12px var(--gut) 20px}
  .w-list{padding:0 var(--gut)}
  body.is-watch .hdr{position:relative}
  .v-title{font-size:18px;line-height:26px;margin-top:0}
  .actions{width:100%;overflow-x:auto;scrollbar-width:none}
  .actions::-webkit-scrollbar{display:none}
  .list-head{padding-top:16px;border-top:1px solid var(--line)}
}
body.pfs .w-player{z-index:300}

/* ---------- 플레이어 ---------- */
.player{position:relative;width:100%;aspect-ratio:16/9;max-height:calc(100vh - var(--hdr) - 136px);min-height:180px;background:#000;border-radius:12px;overflow:hidden;color:#fff;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;isolation:isolate;outline:0}
@media (max-width:1015px){ .player{border-radius:0;max-height:72vh} }
.yt-host{position:absolute;inset:0}
.yt-host iframe,.yt-host>div{position:absolute;inset:0;width:100%!important;height:100%!important;border:0}
.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;transition:opacity .25s}
.player.started .poster,.player.tap-mode .poster,.player.passthru .poster{opacity:0;visibility:hidden}
.shield{position:absolute;inset:0;z-index:2;touch-action:manipulation}
.band{position:absolute;z-index:2;display:none}
.band-top{left:0;right:0;top:0;height:22%}
.band-bl{left:0;bottom:0;width:58%;height:24%}
.player.tap-mode .shield,.player.passthru .shield{display:none}
.player.tap-mode .band,.player.passthru .band{display:block}

.ui{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .2s}
.ui::after{content:"";position:absolute;left:0;right:0;bottom:0;height:min(130px,55%);background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,.28) 55%,transparent);pointer-events:none;z-index:-1}
.player.show-ui .ui{opacity:1}
.player.show-ui .ui-bottom,.player.show-ui .ui-center .cbtn{pointer-events:auto}
.player:not(.started) .ui,.player.tap-mode .ui,.player.passthru .ui,.player.ended .ui,.player.error .ui{display:none}
.player.hide-cursor{cursor:none}
.ui-bottom{position:absolute;left:0;right:0;bottom:0;padding:0 12px}
.bar{position:relative;height:16px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.track{position:relative;flex:1;height:3px;background:rgba(255,255,255,.25);transition:height .1s}
.bar:hover .track,.player.dragging .track{height:5px}
.buf,.fill{position:absolute;left:0;top:0;bottom:0;width:0}
.buf{background:rgba(255,255,255,.45)}
.fill{background:var(--accent)}
.knob{position:absolute;top:50%;left:0;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .1s}
.bar:hover .knob,.player.dragging .knob{transform:scale(1)}
.tip{position:absolute;bottom:22px;left:0;transform:translateX(-50%);padding:3px 8px;border-radius:4px;background:rgba(28,28,28,.9);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;opacity:0;pointer-events:none;white-space:nowrap}
.bar:hover .tip,.player.dragging .tip{opacity:1}
.ctrl{display:flex;align-items:center;height:48px}
.pbtn{width:44px;height:44px;border:0;background:transparent;color:#fff;display:grid;place-items:center;flex:none;opacity:.92;border-radius:50%;padding:0}
.pbtn:hover{opacity:1}
.pbtn .ic{width:26px;height:26px}
.time{font-size:13px;padding:0 8px;white-space:nowrap;font-variant-numeric:tabular-nums;color:#eee}
.time .sep{opacity:.7;padding:0 3px}
.vol{display:flex;align-items:center}
.vol input{width:0;opacity:0;transition:width .15s,opacity .15s,margin .15s;accent-color:#fff;margin:0}
.vol:hover input,.vol:focus-within input{width:64px;opacity:1;margin-right:8px}
.player.playing .i-play,.player:not(.playing) .i-pause{display:none}
.player.muted .i-vol,.player:not(.muted) .i-mute{display:none}
.player.fs .i-fs,.player:not(.fs) .i-fsx{display:none}
.ui-center{display:none}

.spinner{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .9s linear infinite;z-index:5;display:none;pointer-events:none}
.player.buffering .spinner,.player:not(.started):not(.tap-mode):not(.error) .spinner{display:block}
.player.ended .spinner,.player.passthru .spinner{display:none!important}
@keyframes spin{to{transform:rotate(360deg)}}
.bezel{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:5;opacity:0;pointer-events:none}
.bezel .ic{width:34px;height:34px}
.bezel.go{animation:bezel .5s linear}
@keyframes bezel{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(2)}}
.flash{position:absolute;top:0;bottom:0;width:42%;z-index:5;display:grid;place-items:center;pointer-events:none;opacity:0;background:rgba(255,255,255,.14)}
.flash-l{left:0;clip-path:ellipse(100% 85% at 0% 50%)}
.flash-r{right:0;clip-path:ellipse(100% 85% at 100% 50%)}
.flash div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500}
.flash .ic{width:30px;height:30px}
.flash.on{animation:flash .65s ease-out}
@keyframes flash{0%,70%{opacity:1}100%{opacity:0}}

.pbtn.cc{position:relative}
.pbtn.cc::after{content:"";position:absolute;left:11px;right:11px;bottom:8px;height:3px;border-radius:2px;background:var(--accent);transform:scaleX(0);transition:transform .15s}
.player.cc-on .pbtn.cc::after{transform:scaleX(1)}

.end{position:absolute;inset:0;z-index:7;display:grid;place-items:center;background:#000;overflow:hidden}
.end-bg{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(18px) brightness(.32)}
.end-box{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px;width:min(520px,100%)}
.end-up{margin:0;font-size:14px;color:#ccc}
.end-up b{color:#fff;font-variant-numeric:tabular-nums}
.end-next{display:flex;align-items:center;gap:16px;width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:0}
.end-thumb{position:relative;flex:none;width:clamp(112px,36%,200px);aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#222}
.end-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.end-thumb::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.3)}
.ring{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;transform:rotate(-90deg);z-index:1}
.ring circle{fill:none;stroke-width:4}
.ring-bg{stroke:rgba(255,255,255,.3)}
.ring-fg{stroke:#fff;stroke-dasharray:176;stroke-dashoffset:176;animation:ring var(--sec,8s) linear forwards}
@keyframes ring{to{stroke-dashoffset:0}}
.end-play{position:absolute;inset:0;display:grid;place-items:center;z-index:1}
.end-play .ic{width:26px;height:26px}
.end-text{min-width:0;display:flex;flex-direction:column;gap:4px}
.end-title{font-size:16px;font-weight:500;line-height:22px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.end-ch{font-size:13px;color:#bbb}
.end-btns{display:flex;gap:8px;justify-content:center}
.end-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 18px;border-radius:18px;border:0;background:rgba(255,255,255,.16);color:#fff;font-weight:500;font-size:14px}
.end-btn:hover{background:rgba(255,255,255,.26)}
.end-btn .ic{width:20px;height:20px}
.end-btn.primary{background:#fff;color:#0f0f0f}
.end-replay{display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:transparent;color:#fff;font-size:15px;font-weight:500}
.end-replay .ic{width:52px;height:52px}
@media (max-width:640px){
  .end-box{gap:8px;padding:10px 14px}
  .end-up{font-size:12px}
  .end-next{gap:12px}
  .end-title{font-size:14px;line-height:19px}
  .end-ch{font-size:12px}
  .end-btn{height:32px;padding:0 14px;font-size:13px}
  .ring{width:40px;height:40px;margin:-20px 0 0 -20px}
}
.perr{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:#111;text-align:center}
.perr p{margin:0;max-width:440px;font-size:15px;line-height:1.55;color:#eee;word-break:keep-all}
.perr .end-btns{flex-wrap:wrap}

.player.fs{max-height:none;aspect-ratio:auto;border-radius:0;width:100%;height:100%}
.player.pseudo-fs{position:fixed;inset:0;z-index:300;width:100vw;height:100vh;height:100dvh}

/* 터치 화면(휴대폰·태블릿) 컨트롤 */
@media (hover:none){
  .only-desk{display:none!important}
  .ui::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.32);pointer-events:none;z-index:-1}
  .ui-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:clamp(28px,11vw,72px)}
  .cbtn{border:0;background:rgba(0,0,0,.32);color:#fff;border-radius:50%;display:grid;place-items:center;padding:0}
  .cbtn.lg{width:60px;height:60px}
  .cbtn.lg .ic{width:38px;height:38px}
  .cbtn.sm{width:44px;height:44px}
  .cbtn.sm .ic{width:28px;height:28px}
  .ui-bottom{display:flex;flex-direction:column-reverse;padding:0 4px 0 8px}
  .ctrl{height:36px}
  .bar{height:22px;margin:0 4px}
  .knob{transform:scale(1)}
  .player.fs .ui-bottom{padding:0 16px 8px}
  .gear{bottom:60px;max-height:calc(100% - 68px)}
}
.player.playing .cbtn .i-play,.player:not(.playing) .cbtn .i-pause{display:none}

/* ---------- 메뉴·창·알림 ---------- */
.menu-scrim{position:fixed;inset:0;z-index:90}
.menu-scrim.dim{background:rgba(0,0,0,.5)}
.menu{position:fixed;z-index:91;min-width:220px;background:var(--pop);border-radius:12px;box-shadow:var(--pop-shadow);padding:8px 0}
.menu-item{display:flex;align-items:center;gap:16px;width:100%;height:40px;padding:0 24px 0 16px;border:0;background:transparent;font-size:14px;color:var(--fg);text-align:left;white-space:nowrap}
.menu-item:hover,.menu-item:focus-visible{background:var(--hover);outline:0}
.menu.sheet{left:8px;right:8px;bottom:8px;border-radius:16px;padding:8px 0;animation:sheetUp .2s ease-out}
.menu.sheet .menu-item{height:50px;font-size:16px}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}

.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px}
.modal-scrim{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.dialog{position:relative;width:min(560px,100%);background:var(--pop);border-radius:16px;padding:18px 24px 16px;box-shadow:var(--pop-shadow);display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 32px);overflow:auto}
.dlg-head{display:flex;align-items:center;justify-content:space-between;margin-right:-10px}
.dialog h2{margin:0;font-size:20px;font-weight:700}
.dlg-hint{margin:0;font-size:14px;color:var(--fg2);line-height:1.55;word-break:keep-all}
.dlg-hint b{color:var(--fg);font-weight:500}
.dialog textarea{width:100%;min-height:100px;resize:vertical;padding:12px 14px;border-radius:12px;border:1px solid var(--field-line);background:var(--field);color:var(--fg);font:15px/1.5 var(--font)}
.dialog textarea:focus{outline:0;border-color:var(--focus)}
.found{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.found:empty{display:none}
.found-item{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--fg2);min-width:0}
.found-item img{aspect-ratio:16/9;width:100%;object-fit:cover;border-radius:6px;background:var(--skeleton)}
.found-item.dup{opacity:.5}
.found-msg{grid-column:1/-1;font-size:13px;color:var(--fg2);margin:0}
.found-msg.err{color:var(--danger)}
.dlg-actions{display:flex;align-items:center;gap:6px}
@media (max-width:655px){
  .modal{place-items:end stretch;padding:0}
  .dialog{width:100%;border-radius:16px 16px 0 0;padding:16px 16px max(16px, env(safe-area-inset-bottom));animation:sheetUp .22s ease-out;max-height:92vh}
}

.toast{position:fixed;left:24px;bottom:24px;z-index:110;display:flex;align-items:center;gap:8px;min-height:48px;max-width:min(560px,calc(100vw - 32px));padding:6px 8px 6px 16px;border-radius:8px;background:var(--snack);color:var(--snack-fg);font-size:14px;line-height:1.4;box-shadow:0 4px 12px rgba(0,0,0,.2);transform:translateY(calc(100% + 48px));visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.toast.on{transform:none;visibility:visible;transition:transform .25s ease}
.toast span{padding:6px 0;word-break:keep-all}
.toast-btn{border:0;background:transparent;color:var(--snack-link);font-weight:500;height:36px;padding:0 12px;border-radius:18px;flex:none}
@media (max-width:655px){ .toast{left:12px;right:12px;bottom:12px;max-width:none} }

/* ---------- 왼쪽 메뉴(PC) · 아래 메뉴(폰) ---------- */
.rail{position:fixed;left:0;top:var(--hdr);bottom:0;width:72px;padding:4px;display:flex;flex-direction:column;z-index:55;background:var(--bg)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0 14px;border-radius:10px;font-size:10px;line-height:1.2;color:var(--fg);background:none;border:0}
.nav-item:hover{background:var(--hover)}
.nav-item[aria-current="page"]{font-weight:700}
.nav-item .on{display:none}
.nav-item[aria-current="page"] .on{display:block}
.nav-item[aria-current="page"] .off{display:none}
.bnav{display:none}
@media (min-width:792px){ body:not(.is-watch) #app{margin-left:72px} }
@media (max-width:791px){
  .rail{display:none}
  .bnav{position:fixed;left:0;right:0;bottom:0;z-index:58;display:flex;height:calc(52px + env(safe-area-inset-bottom, 0px));padding-bottom:env(safe-area-inset-bottom, 0px);background:var(--bg);border-top:1px solid var(--line)}
  .bnav .nav-item{flex:1;padding:6px 0 0;gap:2px;border-radius:0;justify-content:center}
  .bnav .nav-add{flex:1;display:grid;place-items:center;background:none;border:0;color:var(--fg)}
  .bnav .nav-add span{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--fg3);display:grid;place-items:center}
  body:not(.is-watch) #app{padding-bottom:calc(76px + env(safe-area-inset-bottom, 0px))}
  body:not(.is-watch) .add-pill{display:none}
  body:not(.is-watch) .toast{bottom:calc(64px + env(safe-area-inset-bottom, 0px))}
}
body.is-watch .rail,body.is-watch .bnav{display:none}

/* ---------- 쪽 제목 ---------- */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:20px 0 16px}
.page-head h1{margin:0;font-size:28px;line-height:36px;font-weight:700}
.page-tools{display:flex;gap:8px;flex-wrap:wrap}
.group-h{margin:24px 0 12px;font-size:20px;font-weight:700}
.btn-primary.danger{background:var(--danger);color:#fff}
.empty-ic{width:72px;height:72px;border-radius:50%;background:var(--chip);display:grid;place-items:center}
.empty-ic .ic{width:36px;height:36px}

/* ---------- 재생목록 카드 ---------- */
.pl-stack{position:relative;display:block;padding-top:8px}
.pl-stack::before,.pl-stack::after{content:"";position:absolute;height:4px;border-radius:8px 8px 0 0;background:var(--fg3)}
.pl-stack::before{top:0;left:18px;right:18px;opacity:.3}
.pl-stack::after{top:4px;left:9px;right:9px;opacity:.6}
.pl-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--fg3)}
.pl-empty .ic{width:40px;height:40px}
.pl-count{position:absolute;right:8px;bottom:8px;display:flex;align-items:center;gap:4px;padding:1px 6px 1px 4px;border-radius:4px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:500;line-height:18px}
.pl-count .ic{width:16px;height:16px}
.pl-link{display:block;margin-top:2px;font-weight:500}
.pl-link:hover{color:var(--fg)}
@media (max-width:499px){ .grid .pl-stack::before{left:24px;right:24px} .grid .pl-stack::after{left:12px;right:12px} }

/* ---------- 재생목록 상세 ---------- */
.plpage{display:flex;gap:24px;align-items:flex-start;padding-top:16px}
.plhero{position:sticky;top:calc(var(--hdr) + 16px);width:360px;flex:none;border-radius:16px;overflow:hidden;color:#fff;isolation:isolate;background:#333}
.plhero-bg{position:absolute;inset:-60px;background:#3a3a3a center/cover;filter:blur(48px) saturate(1.4) brightness(.55);z-index:-1}
.plhero-in{padding:24px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(to bottom,rgba(0,0,0,.05),rgba(0,0,0,.4))}
.plhero-thumb{border-radius:12px;background:rgba(255,255,255,.1)}
.plhero h1{margin:4px 0 0;font-size:26px;line-height:34px;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
.plhero-sub{margin:0;font-size:13px;line-height:1.6;opacity:.85}
.plhero-tools{display:flex;gap:8px}
.plhero-tools .icon-btn{color:#fff;background:rgba(255,255,255,.12)}
.plhero-tools .icon-btn:hover{background:rgba(255,255,255,.22)}
.plhero-play{display:flex;gap:8px}
.btn-hero{flex:1;height:38px;border-radius:19px;border:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:rgba(255,255,255,.18);color:#fff;font-weight:500;font-size:14px}
.btn-hero.primary{background:#fff;color:#0f0f0f}
.btn-hero:disabled{opacity:.4;cursor:default}
.btn-hero .ic{width:22px;height:22px}
.pllist{flex:1;min-width:0}
.pllist-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.plrows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plrow{position:relative;display:flex;align-items:center;gap:8px;padding:6px 4px 6px 0;border-radius:12px}
.plrow:hover{background:var(--hover)}
.plrow-idx{width:28px;flex:none;text-align:center;color:var(--fg2);font-size:13px;font-variant-numeric:tabular-nums}
.plrow .thumb{width:160px;flex:none;border-radius:8px}
.plrow-text{flex:1;min-width:0;padding-right:4px}
.plrow-text h3{margin:0 0 4px;font-size:16px;line-height:22px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.plrow .more{position:static;flex:none}
.plrow:hover .more{opacity:1}
.list-note{padding:32px 0;color:var(--fg2);font-size:15px;line-height:1.6;word-break:keep-all}
@media (max-width:1015px){
  .plpage{flex-direction:column;align-items:stretch;gap:12px;padding-top:0}
  .plhero{position:relative;top:0;width:auto;margin-inline:calc(-1 * var(--gut));border-radius:0}
  .plhero-in{padding:20px var(--gut)}
  .plhero-thumb{display:none}
  .pllist{width:100%}
}
@media (max-width:639px){
  .plrow-idx{display:none}
  .plrow .thumb{width:128px}
  .plrow-text h3{font-size:14px;line-height:20px}
  .plrow .sub{font-size:12px;line-height:18px}
}

/* ---------- 재생 화면의 재생목록 상자 ---------- */
.plp{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.plp-head{display:flex;align-items:flex-start;gap:8px;padding:12px 6px 6px 16px;background:var(--chip)}
.plp-titles{flex:1;min-width:0}
.plp-title{display:block;font-size:18px;line-height:26px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plp-sub{font-size:12px;line-height:18px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plp-tools{display:flex;flex:none}
.plp-tools .icon-btn[aria-pressed="true"]{color:var(--fg);background:var(--chip-hover)}
.plp-tools .icon-btn[aria-pressed="false"]{color:var(--fg2)}
.plp-list{max-height:400px;overflow-y:auto;padding:4px 0 8px;overscroll-behavior:contain}
.plp-row{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 0}
.plp-row:hover{background:var(--hover)}
.plp-row.cur{background:var(--chip-hover)}
.plp-idx{width:28px;flex:none;text-align:center;font-size:12px;color:var(--fg2);font-variant-numeric:tabular-nums}
.plp-idx .ic{width:14px;height:14px;margin:auto}
.plp-row .thumb{width:100px;flex:none;border-radius:8px}
.plp-text{min-width:0;display:flex;flex-direction:column;gap:2px}
.plp-text b{font-size:14px;line-height:20px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.plp-text small{font-size:12px;color:var(--fg2)}
.plp.folded .plp-list{display:none}
.plp.folded .plp-head{padding-bottom:10px}
.plp .i-less{display:none}
.plp:not(.folded) .i-more{display:none}
.plp:not(.folded) .i-less{display:block}

/* ---------- 앰비언트 모드 · 극장 모드 ---------- */
.w-player{position:relative;isolation:isolate}
.ambient{position:absolute;inset:0;z-index:-1;pointer-events:none;display:var(--amb,none)}
.ambient img{width:100%;height:100%;object-fit:cover;filter:blur(70px) saturate(1.7);opacity:.5;transform:scale(1.06)}
body.no-ambient .ambient{display:none}
@media (min-width:1016px){
  .watch.theater{grid-template-areas:"p p" "i l"}
  .watch.theater .player{max-height:calc(100vh - var(--hdr) - 72px)}
}
@media (max-width:1015px){ .ambient{display:none} }

/* ---------- 유튜브식 설정 메뉴 ---------- */
.gear{position:absolute;right:12px;bottom:58px;z-index:6;width:300px;max-width:calc(100% - 24px);max-height:calc(100% - 70px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;background:rgba(28,28,28,.92);border-radius:12px;padding:8px 0;color:#eee;text-shadow:0 0 2px rgba(0,0,0,.5)}
.sm-row{display:flex;align-items:center;gap:14px;width:100%;min-height:40px;padding:0 12px 0 16px;border:0;background:transparent;color:inherit;font-size:13px;font-weight:500;text-align:left}
.sm-row:hover,.sm-row:focus-visible{background:rgba(255,255,255,.1);outline:0}
.sm-row .ic{width:22px;height:22px}
.sm-label{flex:1;min-width:0}
.sm-val{display:flex;align-items:center;gap:2px;font-weight:400;opacity:.9;white-space:nowrap;max-width:50%;overflow:hidden;text-overflow:ellipsis}
.sm-val .ic{width:18px;height:18px}
.sm-check{width:22px;flex:none}
.sm-head{display:flex;align-items:center;gap:8px;width:100%;height:44px;padding:0 12px 0 8px;border:0;border-bottom:1px solid rgba(255,255,255,.2);margin-bottom:6px;background:transparent;color:inherit;font-size:14px;font-weight:500;text-align:left}
.sm-sw{position:relative;width:34px;height:14px;border-radius:7px;background:rgba(255,255,255,.3);flex:none}
.sm-sw::after{content:"";position:absolute;top:-3px;left:-2px;width:20px;height:20px;border-radius:50%;background:#bdbdbd;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .15s,background .15s}
.sm-sw.on{background:rgba(255,255,255,.7)}
.sm-sw.on::after{transform:translateX(18px);background:#fff}
.sm-note{padding:4px 16px 8px;font-size:12px;line-height:1.5;opacity:.75;word-break:keep-all;text-shadow:none}
/* 폰: 화면 아래에서 올라오는 시트 */
.sm-sheet-wrap{position:fixed;inset:0;z-index:95}
.sm-sheet-wrap .modal-scrim{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sm-sheet{position:absolute;left:8px;right:8px;bottom:8px;max-height:75vh;overflow-y:auto;background:var(--pop);color:var(--fg);border-radius:16px;padding:8px 0 calc(8px + env(safe-area-inset-bottom, 0px));animation:sheetUp .2s ease-out}
.sm-sheet .sm-row{min-height:48px;font-size:15px;font-weight:400;gap:18px}
.sm-sheet .sm-row:hover{background:var(--hover)}
.sm-sheet .sm-head{border-bottom-color:var(--line);font-size:16px;height:52px}
.sm-sheet .sm-sw{background:var(--chip-hover)}
.sm-sheet .sm-sw::after{background:#fff}
.sm-sheet .sm-sw.on{background:var(--switch-on)}
.sm-sheet .sm-sw.on::after{background:var(--switch-knob)}
.sm-sheet .sm-val{color:var(--fg2)}

/* ---------- 저장 위치 · 고르기 창 ---------- */
.savelist{display:flex;flex-direction:column;max-height:46vh;overflow-y:auto;margin:0 -8px}
.save-row{display:flex;align-items:center;gap:14px;min-height:44px;padding:0 8px;border-radius:8px;font-size:15px;cursor:pointer}
.save-row:hover{background:var(--hover)}
.save-row input{width:20px;height:20px;accent-color:var(--fg);flex:none;margin:0}
.save-row span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save-row small{color:var(--fg2);font-size:12px}
.save-row img{width:80px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;flex:none;background:var(--skeleton)}
.newpl{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.text-in{flex:1;min-width:0;height:42px;border-radius:10px;border:1px solid var(--field-line);background:var(--field);color:var(--fg);padding:0 14px;font:15px var(--font)}
.text-in:focus{outline:0;border-color:var(--focus)}
.dlg-field{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--fg2)}
.set-sel{height:36px;border-radius:10px;border:1px solid var(--field-line);background:var(--field);color:var(--fg);padding:0 10px;font:14px var(--font);max-width:100%}
.pl-found{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--chip);font-size:14px;line-height:1.45;word-break:keep-all}
.pl-found .ic{width:28px;height:28px;flex:none}
.pl-found b{font-weight:500}
.pl-found.err{color:var(--danger)}
.dlg-steps{margin:0;padding-left:20px;font-size:14px;line-height:1.7;color:var(--fg2);word-break:keep-all}
.dlg-steps b{color:var(--fg);font-weight:500}

/* ---------- 설정 페이지 ---------- */
.settings{max-width:760px;padding-bottom:24px}
.set-title{margin:20px 0 8px;font-size:28px;line-height:36px;font-weight:700}
.set-sec{padding:16px 0;border-bottom:1px solid var(--line)}
.set-sec h2{margin:0 0 8px;font-size:18px;font-weight:700}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;flex-wrap:wrap}
.set-txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 220px}
.set-txt b{font-size:15px;font-weight:500}
.set-txt span{font-size:13px;color:var(--fg2);line-height:1.5;word-break:keep-all}
.set-note{margin:0 0 4px;font-size:13px;line-height:1.6;color:var(--fg2);word-break:keep-all}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:3px;border-radius:12px;background:var(--chip)}
.seg-btn{height:32px;padding:0 12px;border:0;border-radius:9px;background:transparent;font-size:13px;font-weight:500;color:var(--fg2)}
.seg-btn[aria-checked="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:10px 20px;font-size:14px;align-items:center}
.keys kbd{display:inline-block;min-width:26px;padding:2px 7px;border-radius:6px;border:1px solid var(--line);background:var(--chip);font:500 12px var(--font);text-align:center;margin-right:3px}
.set-foot{margin:20px 0 0;font-size:13px;color:var(--fg3)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .spinner{animation-duration:1.5s!important;animation-iteration-count:infinite!important}
}

function fmt(sec) {

}

  const m = s / 60; if (m < 60) return `${Math.floor(m)}분 전`;
  const h = m / 60; if (h < 24) return `${Math.floor(h)}시간 전`;
  const d = h / 24; if (d < 7) return `${Math.floor(d)}일 전`;

/* 링크에서 유튜브 영상 ID 뽑기 (watch, youtu.be, shorts, live, embed 모두 가능) */
function parseIds(text) {
  const out = [], seen = new Set();
  const re = /(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\/?\?(?:[^\s#]*?&)?v=|embed\/|shorts\/|live\/|v\/|e\/))([A-Za-z0-9_-]{11})(?![A-Za-z0-9_-])/g;
  let m;
  while ((m = re.exec(text))) if (!seen.has(m[1])) { seen.add(m[1]); out.push(m[1]); }
  if (!out.length) {
    for (const tok of String(text).split(/\s+/)) {
      if (/^[A-Za-z0-9_-]{11}$/.test(tok) && /[0-9_-]|[A-Z].*[a-z]|[a-z].*[A-Z]/.test(tok) && !seen.has(tok)) { seen.add(tok); out.push(tok); }
    }
  }
  return out;
}

/* ---------- 제목·채널 가져오기 ---------- */
async function getJSON(url, ms = 7000) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, { signal: c.signal }); if (!r.ok) throw r.status; return await r.json(); }
  finally { clearTimeout(t); }
}
async function fetchMeta(id) {
  const w = encodeURIComponent('https://www.youtube.com/watch?v=' + id);
  for (const u of [`https://www.youtube.com/oembed?format=json&url=${w}`, `https://noembed.com/embed?url=${w}`]) {
    try { const j = await getJSON(u); if (j && j.title && !j.error) return { title: j.title, author: j.author_name || '' }; } catch (e) {}
  }
  return null;
}
const metaQ = []; let metaBusy = false;
function queueMeta(id) { if (!metaQ.includes(id)) metaQ.push(id); runMeta(); }
async function runMeta() {
  if (metaBusy) return; metaBusy = true;
  while (metaQ.length) {
    const id = metaQ.shift(), v = find(id);
    if (!v) continue;
    if (!v.title) { const m = await fetchMeta(id); if (m && find(id)) { v.title = m.title; v.author = v.author || m.author; save(); rerender(); } }
    if ((!v.title || !v.dur) && !v.probed && !probe.q.includes(id)) probe.q.push(id);
  }
  metaBusy = false; runProbe();
}

/* 숨은 플레이어로 제목·길이 확인 (위 방법이 막혔을 때 대비) */
const probe = { q: [], busy: false, yt: null, cb: null };
async function runProbe() {
  if (probe.busy || !probe.q.length || view.name === 'watch') return;
  probe.busy = true;
  try { await loadApi(); } catch (e) { probe.busy = false; return; }
  while (probe.q.length && view.name !== 'watch') {
    const id = probe.q.shift(), v = find(id);
    if (!v || (v.title && v.dur)) continue;
    const info = await probeOne(id);
    const cur = find(id); if (!cur) continue;
    cur.probed = true;
    if (info) {
      if (!cur.title && info.title) { cur.title = info.title; cur.author = cur.author || info.author; }
      if (!cur.dur && info.dur) cur.dur = info.dur;
      if (info.blocked) cur.blocked = true;
    }
    save(); rerender();
  }
  probe.busy = false;
}
function probeOne(id) {
  return new Promise(res => {
    let iv = 0, n = 0;
    const done = x => { clearTimeout(to); clearInterval(iv); probe.cb = null; res(x); };
    const to = setTimeout(() => done(null), 9000);
    const poll = () => {
      clearInterval(iv);
      iv = setInterval(() => {
        n++;
        try {
          const d = probe.yt.getVideoData() || {}, dur = Math.round(probe.yt.getDuration() || 0);
          if (d.video_id === id && d.title && (dur > 0 || n > 14)) done({ title: d.title, author: d.author || '', dur });
        } catch (e) {}
      }, 250);
    };
    probe.cb = { ready: poll, error: code => done({ blocked: code === 101 || code === 150 }) };
    if (probe.yt) { try { probe.yt.cueVideoById(id); poll(); } catch (e) { done(null); } return; }
    const host = document.createElement('div');
    host.setAttribute('aria-hidden', 'true');
    host.style.cssText = 'position:fixed;left:-10000px;top:0;width:320px;height:180px;opacity:0;pointer-events:none';
    const inner = document.createElement('div'); host.appendChild(inner); document.body.appendChild(host);
    probe.yt = new YT.Player(inner, {

      playerVars: { autoplay: 0, controls: 0, playsinline: 1, ...originVar() },
      events: { onReady: () => probe.cb && probe.cb.ready(), onError: e => probe.cb && probe.cb.error(e.data) }

}

let apiP = null;
function loadApi() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  if (apiP) return apiP;
  apiP = new Promise((res, rej) => {
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (prev) prev(); res(); };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api'; s.async = true;
    s.onerror = () => { apiP = null; rej(new Error('api')); };
    document.head.appendChild(s);
    setTimeout(() => { if (!(window.YT && window.YT.Player)) { apiP = null; rej(new Error('timeout')); } }, 15000);
  });
  return apiP;
}

const BK = 'GOLRABOM1:';
function backupCode() { return BK + btoa(unescape(encodeURIComponent(JSON.stringify({ v: 1, videos: db.videos, playlists: db.playlists })))); }
function restoreFrom(text) {
  text = String(text || '').trim(); let data = null;
  try {
    const i = text.indexOf(BK);
    if (i >= 0) data = JSON.parse(decodeURIComponent(escape(atob(text.slice(i + BK.length).replace(/\s+/g, '')))));
    else if (text.startsWith('{')) data = JSON.parse(text);
  } catch (e) { data = null; }
  if (!data || !Array.isArray(data.videos)) { const ids = parseIds(text); if (ids.length) { addIds(ids); return true; } return false; }
  let nv = 0, np = 0;
  const have = new Set(db.videos.map(v => v.id));
  data.videos.forEach(v => { if (v && /^[A-Za-z0-9_-]{11}$/.test(v.id) && !have.has(v.id)) { db.videos.push({ ...newVideo(v.id), ...v }); have.add(v.id); nv++; } });
  (data.playlists || []).forEach(p => {
    if (!p || !Array.isArray(p.items)) return;
    const items = p.items.filter(id => have.has(id)), ex = p.id && findPl(p.id);
    if (ex) items.forEach(id => { if (!ex.items.includes(id)) ex.items.push(id); });
    else { db.playlists.push({ id: p.id || newId(), name: String(p.name || '재생목록'), items, created: p.created || Date.now(), updated: Date.now(), ...(p.src ? { src: p.src } : {}) }); np++; }
  });
  save(); db.videos.forEach(v => { if (!v.title) queueMeta(v.id); });
  toast(`영상 ${nv}개, 재생목록 ${np}개를 가져왔어요`); rerender(); return true;
}

/* ---------- 플레이어 동작 ---------- */
const P = { alive: false, yt: null, ready: false, v: null, el: null, state: -1, started: false, dur: 0,

const pc = () => P.el.classList;

function startAt(v) { return !v.watched && v.pos > 5 && (!v.dur || v.pos < v.dur - 10) ? v.pos : 0; }

function pMount(v) {

}

/* 브라우저가 자동재생을 막으면, 유튜브 화면을 직접 한 번 눌러서 재생하도록 열어 줌 */

/* 재생 속도 */

/* 수면 타이머 */

}

function bindPlayer() {
  const el = P.el, shield = $('#shield', el), bar = $('#bar', el);

  el.addEventListener('pointerdown', e => { lastPT = e.pointerType || 'mouse'; }, true);
  el.addEventListener('mousemove', () => { if (lastPT === 'mouse' && P.started) showUI(); });

  shield.addEventListener('click', () => {

  });

  shield.addEventListener('pointerup', e => {

    const side = x < 0.36 ? 'l' : x > 0.64 ? 'r' : 'c', now = performance.now();
    if (side !== 'c' && P.started && ((now - lastTap.t < 320 && lastTap.side === side) || (combo && comboT && side === combo.side))) {
      clearTimeout(single); single = 0;
      if (!combo || combo.side !== side) combo = { side, n: 0 };
      combo.n++;

      const f = $(side === 'l' ? '#flashL' : '#flashR', el);
      $('span', f).textContent = (combo.n * 10) + '초';
      f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
      clearTimeout(comboT); comboT = setTimeout(() => { combo = 0; comboT = 0; }, 700);
      lastTap = { t: now, side };
      return;
    }
    lastTap = { t: now, side };
    clearTimeout(single);
    single = setTimeout(() => { single = 0; if (pc().contains('show-ui')) hideUI(); else showUI(); }, side === 'c' ? 0 : 280);
  });

  el.addEventListener('click', e => {
    const b = e.target.closest('[data-p]'); if (!b) return;
    e.stopPropagation();
    if (lastPT !== 'mouse' && b.closest('.ui') && performance.now() < (P.guard || 0)) return;
    if (lastPT === 'mouse') b.blur();
    const a = b.dataset.p;
    const inGear = a === 'gear';
    if (!inGear) closeGear();
    switch (a) {
      case 'toggle': togglePlay(); break;
      case 'next': goNext(); break;
      case 'prev': goPrev(); break;
      case 'mute': toggleMute(); break;
      case 'fs': toggleFS(); break;
      case 'gear': toggleGear(); break;
      case 'theater': toggleTheater(); break;
      case 'cc': toggleCc(); break;
      case 'playnext': goNext(); break;
      case 'replay': replay(); break;
      case 'cancel': renderEnd(nextVideo(P.v.id), false); break;
      case 'remove': removeVideo(P.v.id); break;
    }
    if (!inGear) showUI();
  });

  $('#vol', el).addEventListener('input', e => setVol(+e.target.value));
  $('#gear', el).addEventListener('click', smClick);

  /* 진행 막대 끌기 */
  const fracAt = e => { const r = $('.track', bar).getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); };
  const tipAt = f => { const tip = $('#tip', el); tip.textContent = fmt(f * (P.dur || 0)); tip.style.left = Math.max(24, Math.min(bar.clientWidth - 24, f * bar.clientWidth)) + 'px'; };
  const paintDrag = f => { $('#fill', el).style.width = f * 100 + '%'; $('#knob', el).style.left = f * 100 + '%'; $('#tCur', el).textContent = fmt(f * (P.dur || 0)); tipAt(f); };
  bar.addEventListener('pointerdown', e => {
    if (!P.ready || !P.dur) return;
    e.preventDefault(); bar.setPointerCapture(e.pointerId);
    P.drag = true; pc().add('dragging'); clearTimeout(P.uiT);
    P.frac = fracAt(e); paintDrag(P.frac);
  });
  bar.addEventListener('pointermove', e => {
    if (P.drag) { P.frac = fracAt(e); paintDrag(P.frac); }
    else if (e.pointerType === 'mouse') tipAt(fracAt(e));
  });
  const endDrag = () => { if (!P.drag) return; P.drag = false; pc().remove('dragging'); seekTo(P.frac * P.dur); showUI(); };
  bar.addEventListener('pointerup', endDrag);
  bar.addEventListener('pointercancel', endDrag);
}

/* 키보드 단축키 (유튜브와 같음) */
document.addEventListener('keydown', e => {

  switch (k) {

    case 'ArrowLeft': seekBy(-5); break;

    case 'ArrowUp': setVol((db.prefs.muted ? 0 : db.prefs.volume) + 5); break;

    case 'f': toggleFS(); break;

function addIds(ids, plId) {
  const fresh = ids.filter(id => !find(id)), p = plId && findPl(plId);
  if (fresh.length) {
    const now = Date.now();
    db.videos.unshift(...fresh.map((id, i) => newVideo(id, now - i)));
    fresh.forEach(queueMeta);
  }
  let inPl = 0;
  if (p) { ids.forEach(id => { if (!p.items.includes(id)) { p.items.push(id); inPl++; } }); if (inPl) p.updated = Date.now(); }
  save();
  if (!fresh.length && !inPl) { toast('이미 들어 있는 영상이에요'); return 0; }
  if (view.name === 'missing') location.hash = '#/watch/' + ids[0];
  else if (view.name === 'home') { view.filter = 'all'; renderHome(); }
  else rerender();
  toast(p ? `‘${p.name}’ 재생목록에 영상 ${inPl}개를 넣었어요` : fresh.length > 1 ? `영상 ${fresh.length}개를 추가했어요` : '영상을 추가했어요');

}
function removeVideo(id) {

  const nx = watching ? nextVideo(id) : null;
  const [removed] = db.videos.splice(i, 1);
  const memb = db.playlists.map(p => [p, p.items.indexOf(id)]).filter(([, k]) => k >= 0);
  memb.forEach(([p]) => { p.items = p.items.filter(x => x !== id); });
  save();

    if (find(removed.id)) return;
    db.videos.splice(Math.min(i, db.videos.length), 0, removed);
    memb.forEach(([p, k]) => { if (!p.items.includes(id)) p.items.splice(Math.min(k, p.items.length), 0, id); });

}

/* ---------- 유튜브 재생목록 가져오기 ---------- */
function parseListIds(text, loose = false) {
  const out = [];
  for (const tok of String(text).split(/\s+/)) {
    const m = tok.match(/[?&]list=([A-Za-z0-9_-]{2,})/); if (!m) continue;
    const isPl = /youtube\.com\/(?:playlist|embed\/videoseries)/.test(tok) || !/[?&]v=|youtu\.be\/[A-Za-z0-9_-]{11}|shorts\//.test(tok);
    if ((isPl || loose) && !out.includes(m[1])) out.push(m[1]);
  }
  return out;
}
function listProblem(id) {
  if (/^(WL|LL|LM)$/.test(id)) return '‘나중에 볼 동영상’과 ‘좋아요 표시한 동영상’은 비공개라 가져올 수 없어요. 새 재생목록에 옮긴 뒤 그 링크를 넣어 주세요.';
  if (/^RD/.test(id)) return '유튜브 믹스(자동으로 만든 목록)는 가져올 수 없어요.';
  return '';
}
function fetchPlaylistIds(list) {
  return loadApi().then(() => new Promise((res, rej) => {
    const host = document.createElement('div');
    host.setAttribute('aria-hidden', 'true');
    host.style.cssText = 'position:fixed;left:-10000px;top:0;width:320px;height:180px;opacity:0;pointer-events:none';
    const inner = document.createElement('div'); host.appendChild(inner); document.body.appendChild(host);
    let pl = null, iv = 0, done = false;
    const finish = (ids, err) => {
      if (done) return; done = true; clearInterval(iv); clearTimeout(to);
      try { pl && pl.destroy(); } catch (e) {} host.remove();
      ids ? res(ids) : rej(err || new Error('empty'));
    };
    const to = setTimeout(() => finish(null, new Error('timeout')), 20000);
    pl = new YT.Player(inner, {
      width: 320, height: 180,
      playerVars: { listType: 'playlist', list, autoplay: 0, controls: 0, playsinline: 1, ...originVar() },
      events: {
        onReady: () => {
          try { pl.cuePlaylist({ listType: 'playlist', list, index: 0 }); } catch (e) {}
          let n = 0;
          iv = setInterval(() => {
            n++; let ids = null;
            try { ids = pl.getPlaylist(); } catch (e) {}
            if (ids && ids.length) finish(ids.filter(x => /^[A-Za-z0-9_-]{11}$/.test(x)));
            else if (n > 45) finish(null, new Error('empty'));

}
async function fetchPlMeta(list) {
  const u = encodeURIComponent('https://www.youtube.com/playlist?list=' + list);
  for (const url of [`https://www.youtube.com/oembed?format=json&url=${u}`, `https://noembed.com/embed?url=${u}`]) {
    try { const j = await getJSON(url); if (j && j.title && !j.error) return { title: j.title, author: j.author_name || '' }; } catch (e) {}
  }

}
const plCache = new Map();

  const bad = listProblem(list);

  if (!plCache.has(list)) {
    plCache.set(list, Promise.all([fetchPlaylistIds(list), fetchPlMeta(list)])

const plErr = e => (e && e.message && /[가-힣]/.test(e.message)) ? e.message : '재생목록을 불러오지 못했어요. 비공개 재생목록이면 유튜브에서 ‘일부 공개’나 ‘공개’로 바꿔 주세요.';

  e.preventDefault();
  const items = [...sug.querySelectorAll('.sug')];
  if (!sug.hidden && sugSel >= 0 && items[sugSel]) { location.hash = items[sugSel].getAttribute('href'); q.blur(); return; }
  const s = q.value.trim(); if (!s) return;
  q.blur(); hideSuggest();
  const h = '#/search/' + encodeURIComponent(s);
  if (location.hash === h) showSearch(s); else location.hash = h;
});
$('#sOpen').addEventListener('click', () => { hdr.classList.add('searching'); q.focus(); updateSuggest(); });
$('#sBack').addEventListener('click', () => { hdr.classList.remove('searching'); hideSuggest(); });
$('#sClear').addEventListener('click', () => { q.value = ''; syncClear(); q.focus(); hideSuggest(); });
sug.addEventListener('click', () => { hideSuggest(); q.blur(); hdr.classList.remove('searching'); });

/* ---------- 앱으로 설치 ---------- */
const UA = navigator.userAgent;
const ENV = {
  kakao: /KAKAOTALK/i.test(UA),
  inapp: /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp|; wv\)/i.test(UA),
  ios: /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
  samsung: /SamsungBrowser/i.test(UA),
  android: /Android/i.test(UA)
};
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (view.name === 'home') renderHome(); });
addEventListener('appinstalled', () => {
  installEvt = null; db.prefs.installHide = true; save();
  if (view.name === 'home') renderHome();
  toast('설치했어요. 홈 화면과 앱 목록에서 골라봄을 찾아보세요');
});
function installMode() {
  if (isStandalone() || !/^https?:$/.test(location.protocol)) return null;
  if (ENV.kakao) return 'kakao';
  if (ENV.inapp) return 'inapp';
  if (installEvt) return 'prompt';
  if (ENV.ios) return 'ios';
  return 'manual';
}
function installBarHTML() {
  const m = installMode();
  if (!m || m === 'manual' || db.prefs.installHide) return '';
  const [title, sub, btn, act] = {
    kakao: ['카카오톡에서는 설치가 안 돼요', '브라우저로 열어서 설치하고, 영상은 거기서 넣어 주세요.', '브라우저로 열기', 'open-external'],
    inapp: ['이 앱 안에서는 설치할 수 없어요', '링크를 복사해서 Chrome이나 Safari에서 열어 주세요.', '링크 복사', 'copy-page'],
    prompt: ['골라봄을 앱으로 설치', '홈 화면과 앱 목록에서 바로 열 수 있어요.', '설치', 'install'],
    ios: ['홈 화면에 추가하면 앱처럼 쓸 수 있어요', '공유 버튼 → ‘홈 화면에 추가’', '방법 보기', 'install']
  }[m];
  return `<div class="install" role="region" aria-label="앱 설치"><img class="install-ic" src="icon-192.png" alt="">
    <div class="install-txt"><b>${title}</b><span>${sub}</span></div>
    <button class="btn-primary" type="button" data-act="${act}">${btn}</button>
    <button class="icon-btn install-x" type="button" data-act="install-hide" aria-label="닫기">${icon('close')}</button></div>`;
}
async function doInstall() {
  const m = installMode();
  if (m === 'prompt') {
    const e = installEvt; installEvt = null;
    try { await e.prompt(); const r = await e.userChoice; if (r && r.outcome === 'accepted') { db.prefs.installHide = true; save(); } } catch (er) {}
    if (view.name === 'home') renderHome();
    return;
  }
  if (m === 'kakao') return openExternal();
  if (m === 'inapp') return copyPage();
  if (!m) return toast(isStandalone() ? '이미 앱으로 열려 있어요' : '웹 주소(https://…)로 열어야 설치할 수 있어요');
  installHelp();
}
const pageUrl = () => location.href.split('#')[0];
function openExternal() { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(pageUrl()); }
async function copyPage() { toast(await copyText(pageUrl()) ? '링크를 복사했어요. Chrome이나 Safari 주소창에 붙여넣어 주세요' : '복사하지 못했어요'); }
function installHelp() {
  const steps = ENV.ios
    ? ['화면 아래(또는 주소창 옆)의 공유 버튼을 누르세요', '목록을 내려서 ‘홈 화면에 추가’를 누르세요', '오른쪽 위 ‘추가’를 누르면 끝이에요']
    : ENV.samsung
      ? ['화면 아래 메뉴(≡)를 누르세요', '‘현재 페이지 추가’를 누르세요', '‘홈 화면’을 고르면 끝이에요']
      : ENV.android
        ? ['오른쪽 위 ⋮ 메뉴를 누르세요', '‘앱 설치’나 ‘홈 화면에 추가’를 누르세요', '‘설치’를 누르면 홈 화면과 앱 목록에 생겨요']
        : ['주소창 오른쪽의 설치 아이콘을 누르세요', '안 보이면 브라우저 메뉴에서 ‘앱 설치’ 또는 ‘골라봄 설치’를 고르세요'];
  const note = ENV.ios ? `<p class="dlg-note">아이폰은 홈 화면 앱과 Safari가 저장 공간을 따로 써요. 이미 넣은 영상이 있으면 ⋮ 메뉴의 ‘모든 링크 복사’로 옮겨 주세요.</p>` : '';
  openDialog(`<div class="dlg-head"><h2 id="dlgT">앱으로 설치하기</h2><button type="button" class="icon-btn" data-close aria-label="닫기">${icon('close')}</button></div>
    <ol class="steps">${steps.map(t => `<li>${esc(t)}</li>`).join('')}</ol>${note}
    <div class="dlg-actions"><span class="grow"></span><button type="button" class="btn-primary" data-close>확인</button></div>`);
}
function openDialog(inner) {
  closeMenu();
  const wrap = document.createElement('div');
  wrap.className = 'modal';
  wrap.innerHTML = `<div class="modal-scrim" data-close></div><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgT">${inner}</div>`;
  document.body.appendChild(wrap); document.body.classList.add('no-scroll');
  const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
  const close = () => { wrap.remove(); document.removeEventListener('keydown', onKey, true); if (!document.querySelector('.modal')) document.body.classList.remove('no-scroll'); };
  document.addEventListener('keydown', onKey, true);
  wrap.addEventListener('click', e => { if (e.target.closest('[data-close]')) close(); });
  const f = wrap.querySelector('.btn-primary'); if (f && !isTouch()) setTimeout(() => f.focus(), 60);
  return { close, box: wrap.querySelector('.dialog'), wrap };
}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ---------- 버튼 연결 ---------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const id = a.dataset.id, pid = a.dataset.pl || view.pl;
  switch (a.dataset.act) {
    case 'add': openAdd(); break;
    case 'card-menu': e.preventDefault(); if (menuOpen && menuOpen.anchor === a) closeMenu(); else openMenu(a, cardMenu(id)); break;
    case 'hdr-more': if (menuOpen && menuOpen.anchor === a) closeMenu(); else openMenu(a, hdrMenu()); break;
    case 'chip': view.filter = a.dataset.f; renderHome(); break;
    case 'copy-link': copyLink(id); break;
    case 'remove': removeVideo(id); break;
    case 'add-this': addIds([id]); break;
    case 'install': doInstall(); break;
    case 'open-external': openExternal(); break;
    case 'copy-page': copyPage(); break;
    case 'install-hide': db.prefs.installHide = true; save(); renderHome(); toast('오른쪽 위 ⋮ 메뉴에서 언제든 설치할 수 있어요'); break;
    case 'autoplay': e.preventDefault(); db.prefs.autoplay = !db.prefs.autoplay; save(); a.setAttribute('aria-checked', String(db.prefs.autoplay)); toast(db.prefs.autoplay ? '자동재생을 켰어요' : '자동재생을 껐어요'); break;
    case 'save-to': openSaveTo(id); break;
    case 'pl-new': newPlFlow(); break;
    case 'pl-import': openImport(); break;
    case 'pl-menu': e.preventDefault(); if (menuOpen && menuOpen.anchor === a) closeMenu(); else openMenu(a, plMenu(pid)); break;
    case 'plrow-menu': e.preventDefault(); if (menuOpen && menuOpen.anchor === a) closeMenu(); else openMenu(a, plRowMenu(pid, id)); break;
    case 'pl-play': playPl(pid, false); break;
    case 'pl-shuffle-play': playPl(pid, true); break;
    case 'pl-rename': { const p = findPl(pid); if (p) promptName('재생목록 이름 바꾸기', p.name, '저장', n => { p.name = n; touchPl(p); rerender(); toast('이름을 바꿨어요'); }); break; }
    case 'pl-sync': syncPl(findPl(pid)); break;
    case 'pl-delete': { const p = findPl(pid); if (p) deletePl(p); break; }
    case 'pl-pick': openPick(pid); break;
    case 'pl-add-links': openAdd('', pid); break;
    case 'pl-loop': PL.loop = !PL.loop; a.setAttribute('aria-pressed', String(PL.loop)); toast(PL.loop ? '재생목록 반복을 켰어요' : '재생목록 반복을 껐어요'); break;
    case 'pl-shuffle': { PL.shuffle = !PL.shuffle; PL.order = null; const v = find(view.id); if (v) renderWatchMeta(v); toast(PL.shuffle ? '셔플을 켰어요' : '셔플을 껐어요'); break; }
    case 'pl-fold': { PL.folded = !PL.folded; const v = find(view.id); if (v) renderWatchMeta(v); break; }
    case 'hist-clear': clearHistory(); break;
    case 'pref': { const k = a.dataset.k; db.prefs[k] = a.dataset.v; save(); if (k === 'theme') applyTheme(); renderSettings(); break; }
    case 'pref-toggle': { const k = a.dataset.k; db.prefs[k] = !db.prefs[k]; save(); if (k === 'ambient') applyAmbient(); a.setAttribute('aria-checked', String(!!db.prefs[k])); break; }
    case 'backup-copy': copyText(backupCode()).then(ok => toast(ok ? '백업 코드를 복사했어요. 다른 기기의 설정 → 백업 코드로 복원에 붙여넣으세요' : '복사하지 못했어요')); break;
    case 'backup-restore': openRestore(); break;
    case 'copy-links': if (!db.videos.length) toast('아직 넣어 둔 영상이 없어요'); else copyText(db.videos.map(v => 'https://youtu.be/' + v.id).join('\n')).then(ok => toast(ok ? `링크 ${db.videos.length}개를 복사했어요` : '복사하지 못했어요')); break;
    case 'wipe': wipeAll(); break;
  }
});
document.addEventListener('change', e => {
  const s = e.target.closest && e.target.closest('select[data-k]'); if (!s) return;
  const k = s.dataset.k; db.prefs[k] = k === 'rate' ? +s.value : s.value; save(); toast('설정을 바꿨어요');
});

/* ---------- 주소(#)에 따라 화면 바꾸기 ---------- */
function route() {
  const h = location.hash.replace(/^#\/?/, ''), qi = h.indexOf('?');
  const path = qi < 0 ? h : h.slice(0, qi), params = new URLSearchParams(qi < 0 ? '' : h.slice(qi + 1));
  const i = path.indexOf('/'), a = i < 0 ? path : path.slice(0, i), arg = i < 0 ? '' : path.slice(i + 1);
  let dec = arg; try { dec = decodeURIComponent(arg); } catch (e) {}
  if (a === 'watch' && dec) showWatch(dec, params.get('list'));
  else if (a === 'search' && dec) showSearch(dec);
  else if (a === 'playlists') showPlaylists();
  else if (a === 'playlist' && dec) showPlaylist(dec);
  else if (a === 'history') showHistory();
  else if (a === 'settings') showSettings();
  else showHome();
}
function renderNav() {
  const it = (k, href, off, on, label) => `<a class="nav-item" data-nav="${k}" href="${href}" aria-current="false">${icon(on, 'on')}${icon(off, 'off')}<span>${label}</span></a>`;
  const items = [it('home', '#/', 'homeO', 'home', '홈'), it('playlists', '#/playlists', 'playlist', 'playlist', '재생목록'), it('history', '#/history', 'history', 'history', '기록'), it('settings', '#/settings', 'gear', 'gear', '설정')];
  $('#rail').innerHTML = items.join('');
  $('#bnav').innerHTML = items.slice(0, 2).join('') + `<button class="nav-add" type="button" data-act="add" aria-label="영상 추가"><span>${icon('add')}</span></button>` + items.slice(2).join('');
}
applyTheme(); applyAmbient(); renderNav();
addEventListener('hashchange', route);
route();
db.videos.forEach(v => { if (!v.title || !v.dur) queueMeta(v.id); });
})();
</script>
